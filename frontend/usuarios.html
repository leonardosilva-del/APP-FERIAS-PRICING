<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Usuários - Intranet Pricing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --text-900: #0f172a;
            --text-600: #475569;
            --text-400: #94a3b8;
            --border-light: #e2e8f0;
            --border-hover: #cbd5e1;
            --brand-primary: #2563eb;
            --status-success: #10b981;
            --status-danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-900);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- TELA DE CARREGAMENTO --- */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-body);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-600);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .spinner {
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
            color: var(--brand-primary);
        }

        /* --- WIDGET DE PERFIL --- */
        .user-profile-widget {
            position: absolute;
            top: 24px;
            right: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-surface);
            padding: 6px 16px 6px 6px;
            border-radius: 50px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
            transition: all 0.2s ease;
            z-index: 100;
        }

        .user-profile-widget:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--brand-primary);
            object-fit: cover;
        }

        .user-info-widget {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .user-name-widget {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-900);
            line-height: 1.2;
        }

        .user-role-widget {
            font-size: 0.7rem;
            color: var(--text-400);
            line-height: 1.2;
        }

        .btn-logout-widget {
            background: transparent;
            border: none;
            color: var(--text-400);
            padding: 6px;
            margin-left: 4px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-logout-widget:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        /* Header Principal */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
            padding: 2rem;
            display: none; /* Escondido até o Firebase liberar */
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 2rem;
            gap: 1.5rem;
        }

        .header-logo {
            height: 48px;
            object-fit: contain;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-600);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            transition: all 0.2s;
            border: 1px solid var(--border-light);
            background-color: var(--bg-surface);
            box-shadow: var(--shadow-sm);
        }

        .back-btn:hover {
            color: var(--text-900);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-900);
        }

        /* Painel e Tabela */
        .panel {
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .panel-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-light);
            background: #f8fafc;
        }

        .panel-header h2 {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-900);
        }

        .panel-header p {
            font-size: 0.9rem;
            color: var(--text-600);
            margin-top: 0.25rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: var(--bg-surface);
            padding: 1rem 1.5rem;
            text-align: left;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-600);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-light);
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: #f8fafc;
        }

        .td-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .td-user img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border-light);
            object-fit: cover;
        }

        .td-user-info strong {
            display: block;
            color: var(--text-900);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .td-user-info span {
            color: var(--text-400);
            font-size: 0.8rem;
        }

        .role-select {
            padding: 8px 12px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            background-color: var(--bg-surface);
            transition: all 0.2s;
        }

        .role-select:hover {
            border-color: var(--border-hover);
        }

        .role-select:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .role-select.gestor { color: var(--brand-primary); background-color: #eff6ff; border-color: #bfdbfe; }
        .role-select.colaborador { color: #059669; background-color: #ecfdf5; border-color: #a7f3d0; }
        .role-select.bloqueado { color: var(--status-danger); background-color: #fef2f2; border-color: #fecaca; }

        .btn-excluir {
            background: transparent;
            border: none;
            color: var(--text-400);
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 1.1rem;
        }

        .btn-excluir:hover {
            background: #fef2f2;
            color: var(--status-danger);
        }

        /* Toasts */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: var(--shadow-md);
            animation: slideIn 0.3s forwards;
            pointer-events: auto;
        }

        .toast.success { background-color: var(--status-success); }
        .toast.error { background-color: var(--status-danger); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>

<body>

    <div id="toast-container"></div>

    <!-- TELA DE LOADING (Prevenindo a Tela Branca) -->
    <div id="loading-screen">
        <svg class="spinner" width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
        </svg>
        <h2 style="font-weight: 600; font-size: 1.2rem;">Autenticando acesso...</h2>
    </div>

    <!-- WIDGET DE PERFIL DO USUÁRIO -->
    <div class="user-profile-widget" style="display: none;" id="widget-perfil">
        <img id="user-photo" src="" class="user-avatar" alt="Foto">
        <div class="user-info-widget">
            <span id="user-name-widget" class="user-name-widget">Carregando...</span>
            <span id="user-role-widget" class="user-role-widget">Gestor</span>
        </div>
        <button id="btn-logout" class="btn-logout-widget" title="Sair da Intranet">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                </path>
            </svg>
        </button>
    </div>

    <div class="container" id="main-container">
        <div class="header">
            <a href="/" class="back-btn" title="Voltar ao Menu Principal">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg> Voltar
            </a>
            <img src="/logo.png" alt="Dia a Dia" class="header-logo">
            <h1>Gestão de Usuários</h1>
        </div>

        <div class="panel">
            <div class="panel-header">
                <h2>Equipe Cadastrada</h2>
                <p>Controle os níveis de acesso das pessoas à Intranet Pricing.</p>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Colaborador</th>
                        <th>Data de Primeiro Acesso</th>
                        <th>Nível de Permissão</th>
                        <th style="text-align: center;">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-usuarios">
                    <tr><td colspan="4" style="text-align: center; padding: 2rem; color: #94a3b8;">Carregando usuários...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { ref, get, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        let usuarioAtual = null;

        // UI & UTILITÁRIOS
        window.showToast = function (message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // VERIFICAÇÃO DE AUTENTICAÇÃO E PERFIL DE GESTOR
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "/";
                return;
            }

            usuarioAtual = user;
            document.getElementById('user-photo').src = user.photoURL || 'https://via.placeholder.com/40';
            document.getElementById('user-name-widget').textContent = user.displayName ? user.displayName.split(' ')[0] : 'Usuário';

            try {
                const userRef = ref(db, 'usuarios/' + user.uid);
                const snapshot = await get(userRef);

                if (snapshot.exists()) {
                    const perfil = snapshot.val().perfil;
                    
                    // BARREIRA DE SEGURANÇA
                    if (perfil !== "Gestor") {
                        alert("Acesso Negado: Apenas gestores podem visualizar o painel de usuários.");
                        window.location.href = "/";
                        return;
                    }

                    // Libera a tela se for Gestor
                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('widget-perfil').style.display = 'flex';
                    document.getElementById('main-container').style.display = 'block';

                    carregarListaDeUsuarios();
                } else {
                    window.location.href = "/";
                }
            } catch (error) {
                alert("Erro ao conectar com o banco de dados.");
                console.error(error);
                window.location.href = "/";
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = "/"; });
        });

        // CARREGA TODOS OS USUÁRIOS EM TEMPO REAL
        function carregarListaDeUsuarios() {
            const usuariosRef = ref(db, 'usuarios');
            onValue(usuariosRef, (snapshot) => {
                const tbody = document.getElementById('tabela-usuarios');
                tbody.innerHTML = '';

                if (!snapshot.exists()) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">Nenhum usuário encontrado.</td></tr>';
                    return;
                }

                const usuarios = [];
                snapshot.forEach(child => {
                    usuarios.push({ uid: child.key, ...child.val() });
                });

                // Ordena por nome
                usuarios.sort((a, b) => (a.nome || "").localeCompare(b.nome || ""));

                usuarios.forEach(u => {
                    const foto = u.foto || 'https://via.placeholder.com/40';
                    const dataAcesso = u.criadoEm ? new Date(u.criadoEm).toLocaleDateString('pt-BR') : 'Desconhecida';
                    const perfil = u.perfil || 'Colaborador';
                    
                    // Aplica classe de cor no select baseada no perfil atual
                    let selectClass = '';
                    if(perfil === 'Gestor') selectClass = 'gestor';
                    else if(perfil === 'Bloqueado') selectClass = 'bloqueado';
                    else selectClass = 'colaborador';

                    // Desabilita alteração e exclusão do próprio gestor que está logado
                    const isMe = (u.uid === usuarioAtual.uid);
                    const disabledStr = isMe ? 'disabled title="Você não pode alterar seu próprio nível aqui"' : '';

                    tbody.innerHTML += `
                        <tr>
                            <td>
                                <div class="td-user">
                                    <img src="${foto}" alt="Foto">
                                    <div class="td-user-info">
                                        <strong>${u.nome || 'Usuário Sem Nome'}</strong>
                                        <span>${u.email}</span>
                                    </div>
                                </div>
                            </td>
                            <td style="color: var(--text-600); font-size: 0.9rem;">${dataAcesso}</td>
                            <td>
                                <select class="role-select ${selectClass}" onchange="window.alterarPerfil('${u.uid}', this.value, this)" ${disabledStr}>
                                    <option value="Colaborador" ${perfil === 'Colaborador' ? 'selected' : ''}>Colaborador</option>
                                    <option value="Gestor" ${perfil === 'Gestor' ? 'selected' : ''}>Gestor (Admin)</option>
                                    <option value="Bloqueado" ${perfil === 'Bloqueado' ? 'selected' : ''}>Bloqueado (Sem Acesso)</option>
                                </select>
                            </td>
                            <td style="text-align: center;">
                                <button class="btn-excluir" onclick="window.removerUsuario('${u.uid}', '${u.nome}')" ${disabledStr} title="Remover usuário do banco">🗑️</button>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        // FUNÇÃO PARA ATUALIZAR O PERFIL NO BANCO
        window.alterarPerfil = function(uid, novoPerfil, selectElement) {
            update(ref(db, 'usuarios/' + uid), { perfil: novoPerfil }).then(() => {
                showToast("Perfil atualizado com sucesso!", "success");
            }).catch((err) => {
                showToast("Erro ao atualizar: " + err.message, "error");
            });
        }

        // FUNÇÃO PARA REMOVER O REGISTRO DO BANCO
        window.removerUsuario = function(uid, nome) {
            if (confirm(`Tem certeza que deseja apagar o registro de ${nome}? Eles perderão o acesso.`)) {
                remove(ref(db, 'usuarios/' + uid)).then(() => {
                    showToast("Usuário removido da base.", "success");
                });
            }
        }

    </script>
</body>

</html>
