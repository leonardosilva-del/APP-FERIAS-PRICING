<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pricing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --bg-swimlane: #f8fafc;
            --text-900: #0f172a;
            --text-600: #475569;
            --text-400: #94a3b8;
            --border-light: #e2e8f0;
            --border-hover: #cbd5e1;
            --brand-primary: #6366f1;
            --brand-primary-hover: #4f46e5;
            --brand-secondary: #8b5cf6;
            --status-success: #10b981;
            --status-success-bg: #d1fae5;
            --status-warning: #f59e0b;
            --status-danger: #ef4444;
            --status-danger-hover: #dc2626;
            --status-info: #0ea5e9;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-900);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- WIDGET DE PERFIL --- */
        .user-profile-widget {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-surface);
            padding: 6px 16px 6px 6px;
            border-radius: 50px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-light);
            transition: all 0.2s ease;
        }

        .user-profile-widget:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--brand-primary);
            object-fit: cover;
        }

        .user-info-widget {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .user-name-widget {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-900);
            line-height: 1.2;
        }

        .user-role-widget {
            font-size: 0.7rem;
            color: var(--text-400);
            line-height: 1.2;
        }

        .btn-logout-widget {
            background: transparent;
            border: none;
            color: var(--text-400);
            padding: 6px;
            margin-left: 4px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-logout-widget:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-600);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            transition: all 0.2s;
            border: 1px solid var(--border-light);
            background-color: var(--bg-swimlane);
        }

        .back-btn:hover {
            background-color: var(--bg-surface);
            color: var(--text-900);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-sm);
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: var(--shadow-md);
            animation: slideIn 0.3s forwards;
            pointer-events: auto;
        }

        .toast.success {
            background-color: var(--status-success);
        }

        .toast.error {
            background-color: var(--status-danger);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Modal Nova Demanda */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: var(--bg-surface);
            padding: 30px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: var(--shadow-lg);
            box-sizing: border-box;
        }

        .modal-content h2 {
            margin: 0 0 10px 0;
            color: var(--text-900);
            font-size: 1.5rem;
            text-align: center;
        }

        .modal-content label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-600);
            margin-bottom: -10px;
        }

        .modal-content input,
        .modal-content select {
            padding: 12px;
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            background: var(--bg-swimlane);
        }

        .modal-content input:focus,
        .modal-content select:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            background: var(--bg-surface);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-save {
            background-color: var(--brand-primary);
            color: white;
        }

        .btn-save:hover {
            background-color: var(--brand-primary-hover);
        }

        .btn-cancel {
            background-color: var(--bg-swimlane);
            color: var(--text-600);
            border: 1px solid var(--border-light);
        }

        .btn-cancel:hover {
            background-color: var(--border-light);
            color: var(--text-900);
        }

        /* Estrutura Core */
        .topbar {
            background: var(--bg-surface);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            z-index: 30;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-900);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
        }

        .week-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-body);
            padding: 0.25rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-600);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: var(--bg-surface);
            color: var(--text-900);
            box-shadow: var(--shadow-sm);
        }

        .week-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-600);
            padding: 0 0.5rem;
            min-width: 130px;
            text-align: center;
        }

        .topbar-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.6rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-secondary {
            background: var(--bg-surface);
            color: var(--text-600);
            border-color: var(--border-light);
        }

        .btn-secondary:hover {
            border-color: var(--border-hover);
            color: var(--text-900);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary {
            background: var(--brand-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-primary:hover {
            background: var(--brand-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        .workspace {
            flex: 1;
            padding: 1.5rem 2rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .board-container {
            flex: 1;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            overflow: auto;
            position: relative;
        }

        .board-grid {
            display: grid;
            grid-template-columns: 280px repeat(6, minmax(280px, 1fr));
            min-width: max-content;
        }

        .day-header {
            position: sticky;
            top: 0;
            background: var(--bg-surface);
            padding: 1rem;
            border-bottom: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .day-header.sticky-left {
            left: 0;
            z-index: 30;
            background: var(--bg-surface);
        }

        .day-info {
            display: flex;
            flex-direction: column;
        }

        .day-name {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-400);
            font-weight: 600;
        }

        .day-date {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-900);
            margin-top: 0.1rem;
        }

        .day-header.today {
            border-bottom: 3px solid var(--brand-primary);
        }

        .day-header.today .day-date {
            color: var(--brand-primary);
        }

        .user-cell {
            position: sticky;
            left: 0;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            padding: 1.5rem;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--brand-primary);
            object-fit: cover;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-900);
        }

        .user-role {
            font-size: 0.75rem;
            color: var(--text-400);
            margin-top: 0.1rem;
        }

        .task-lane {
            padding: 1rem;
            background: var(--bg-swimlane);
            border-right: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 180px;
        }

        .task-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            border-left: 3px solid var(--brand-primary);
        }

        .task-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--border-hover);
        }

        .task-card.priority-high {
            border-left-color: var(--status-danger);
        }

        .task-card.priority-low {
            border-left-color: var(--status-info);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .tags {
            display: flex;
            gap: 0.4rem;
        }

        .tag {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .tag.base {
            background: #e0e7ff;
            color: #4338ca;
        }

        .task-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-900);
            line-height: 1.4;
            margin-bottom: 0.75rem;
        }

        .task-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-light);
            padding-top: 0.5rem;
            margin-top: auto;
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-600);
            font-weight: 500;
        }

        .custom-checkbox input {
            display: none;
        }

        .checkmark {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-hover);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .custom-checkbox input:checked+.checkmark {
            background-color: var(--status-success);
            border-color: var(--status-success);
        }

        .custom-checkbox input:checked+.checkmark::after {
            content: "✓";
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .task-card.is-done {
            background: #f8fafc;
            border-left-color: var(--status-success);
            opacity: 0.8;
        }

        .task-card.is-done .task-title {
            text-decoration: line-through;
            color: var(--text-400);
        }

        .add-task-btn {
            border: 1px dashed var(--border-hover);
            background: transparent;
            color: var(--text-400);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: auto;
        }

        .add-task-btn:hover {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
            background: rgba(99, 102, 241, 0.05);
        }
    </style>
</head>

<body>

    <div id="toast-container"></div>

    <!-- Modal Nova Demanda -->
    <div id="modalDemanda" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>Nova Demanda</h2>

            <label>O que precisa ser feito?</label>
            <input type="text" id="demanda-titulo" placeholder="Ex: Análise de Preços">

            <label>Responsável</label>
            <select id="demanda-colaborador">
                <!-- Injetado via JS com usuários do Firebase -->
            </select>

            <label>Data</label>
            <input type="date" id="demanda-data">

            <label>Prioridade/Tipo</label>
            <select id="demanda-tipo">
                <option value="Rotina">Rotina (Azul)</option>
                <option value="Extra">Demanda Extra (Amarelo)</option>
                <option value="Urgente">Urgente (Vermelho)</option>
            </select>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModalDemanda()">Cancelar</button>
                <button class="btn-save" id="btnSalvarDemanda">Salvar Tarefa</button>
            </div>
        </div>
    </div>

    <!-- Topbar -->
    <header class="topbar">
        <div class="topbar-left">
            <a href="/" class="back-btn" title="Voltar ao Menu Principal">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg> Voltar
            </a>
            <div class="logo" style="margin-left: 10px;">
                <div class="logo-icon">DD</div> Agenda Pricing
            </div>

            <div class="week-selector">
                <button class="btn-icon" id="btn-prev-week" title="Semana Anterior">❮</button>
                <span class="week-label" id="week-label">Carregando...</span>
                <button class="btn-icon" id="btn-next-week" title="Próxima Semana">❯</button>
            </div>
            <button class="btn btn-secondary" id="btn-today"
                style="padding: 0.4rem 0.8rem; font-size: 0.75rem;">Hoje</button>
        </div>

        <div class="topbar-actions">
            <!-- Botão exibido somente para Gestor -->
            <button class="btn btn-primary" id="btnAbrirModal" onclick="abrirModalDemanda()" style="display: none;">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Nova Demanda
            </button>

            <!-- WIDGET DE PERFIL DO USUÁRIO -->
            <div class="user-profile-widget">
                <img id="user-photo" src="" class="user-avatar" alt="Foto">
                <div class="user-info-widget">
                    <span id="user-name-widget" class="user-name-widget">Carregando...</span>
                    <span id="user-role-widget" class="user-role-widget">Colaborador</span>
                </div>
                <button id="btn-logout" class="btn-logout-widget" title="Sair da Intranet">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="workspace">
        <div class="board-container">
            <div class="board-grid" id="board-grid-content">
                <!-- O JavaScript injeta as colunas e tarefas aqui -->
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { ref, onValue, push, set, update, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        // ==========================================
        // VARIÁVEIS GLOBAIS
        // ==========================================
        let usuarioAtual = null;
        let perfilUsuario = "Colaborador";
        let listaUsuariosGlobal = [];
        let listaTarefasGlobal = {};
        let dataInicioSemana = getStartOfWeek(new Date());

        const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        const diasDaSemana = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

        // ==========================================
        // UI & UTILITÁRIOS
        // ==========================================
        window.showToast = function (message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'fadeOut 0.3s forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        window.abrirModalDemanda = function (dataPadrao = "") {
            document.getElementById('modalDemanda').style.display = 'flex';
            document.getElementById('demanda-titulo').value = '';
            document.getElementById('demanda-data').value = dataPadrao || formataDataISO(new Date());
        }

        window.fecharModalDemanda = function () {
            document.getElementById('modalDemanda').style.display = 'none';
        }

        function getStartOfWeek(data) {
            const d = new Date(data);
            const diaSemana = d.getDay();
            const diff = d.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function formataDataISO(data) {
            const tzOffset = (new Date()).getTimezoneOffset() * 60000;
            return (new Date(data - tzOffset)).toISOString().split('T')[0];
        }

        // ==========================================
        // VERIFICAÇÃO DE AUTENTICAÇÃO E PERFIL
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                // Redireciona se não estiver logado
                window.location.href = "/";
                return;
            }

            usuarioAtual = user;

            // Preenche os dados no widget superior
            document.getElementById('user-photo').src = user.photoURL || 'https://via.placeholder.com/40';
            document.getElementById('user-name-widget').textContent = user.displayName ? user.displayName.split(' ')[0] : 'Usuário';

            // Busca dados do usuário logado no banco
            const userRef = ref(db, 'usuarios/' + user.uid);
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const dados = snapshot.val();
                    perfilUsuario = dados.perfil || "Colaborador";
                }

                document.getElementById('user-role-widget').textContent = perfilUsuario;

                // Se for Gestor, exibe botão de Nova Demanda
                if (perfilUsuario === "Gestor") {
                    document.getElementById('btnAbrirModal').style.display = 'inline-flex';
                }

                carregarUsuarios();
                carregarTarefas();
            });
        });

        // Evento Logout do Widget
        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "/";
            });
        });

        // ==========================================
        // CARREGAR USUÁRIOS E PREENCHER SELECT
        // ==========================================
        function carregarUsuarios() {
            const usuariosRef = ref(db, 'usuarios');
            onValue(usuariosRef, (snapshot) => {
                listaUsuariosGlobal = [];
                const selectColab = document.getElementById('demanda-colaborador');
                selectColab.innerHTML = '';

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    Object.keys(data).forEach(uid => {
                        const u = data[uid];
                        u.uid = uid;
                        listaUsuariosGlobal.push(u);

                        const option = document.createElement('option');
                        option.value = u.email;
                        option.textContent = u.nome || u.email;
                        selectColab.appendChild(option);
                    });
                }
                renderizarGrid();
            });
        }

        // ==========================================
        // AUTOMAGIC ROLLOVER (TAREFAS ACUMULADAS)
        // ==========================================
        function verificarEAtualizarPendentes(tarefas) {
            const hojeStr = formataDataISO(new Date());
            let houveAtualizacao = false;

            Object.keys(tarefas).forEach(taskId => {
                const task = tarefas[taskId];

                // Se a tarefa estiver "Pendente" e a data for estritamente anterior a hoje
                if (task.status === "Pendente" && task.data < hojeStr) {
                    const taskRef = ref(db, 'agenda_tarefas/' + taskId);
                    update(taskRef, {
                        data: hojeStr,
                        transferidaDe: task.data,
                        transferidaEm: new Date().toISOString()
                    });
                    houveAtualizacao = true;
                }
            });

            if (houveAtualizacao) {
                window.showToast("Tarefas pendentes foram transferidas para hoje!", "info");
            }
        }

        // ==========================================
        // RENDERIZAR GRID DA AGENDA
        // ==========================================
        function renderizarGrid() {
            const gridContainer = document.getElementById('board-grid-content');
            gridContainer.innerHTML = '';

            const dataFimSemana = new Date(dataInicioSemana);
            dataFimSemana.setDate(dataInicioSemana.getDate() + 5);
            document.getElementById('week-label').textContent = `${dataInicioSemana.getDate()} ${meses[dataInicioSemana.getMonth()]} - ${dataFimSemana.getDate()} ${meses[dataFimSemana.getMonth()]}`;

            const hojeISO = formataDataISO(new Date());

            // Filtro de exibições base do perfil
            let usuariosExibicao = [];
            if (perfilUsuario === "Gestor") {
                usuariosExibicao = listaUsuariosGlobal;
            } else {
                usuariosExibicao = listaUsuariosGlobal.filter(u => u.email === usuarioAtual.email);
                if (usuariosExibicao.length === 0) {
                    usuariosExibicao = [{
                        uid: usuarioAtual.uid,
                        nome: usuarioAtual.displayName,
                        email: usuarioAtual.email,
                        foto: usuarioAtual.photoURL,
                        perfil: perfilUsuario
                    }];
                }
            }

            // 1. CABEÇALHO DOS DIAS
            let headerHTML = `<div class="day-header sticky-left"><span style="font-weight: 600; color: var(--text-600); font-size: 0.85rem;">Equipe (${usuariosExibicao.length})</span></div>`;
            let datasDaSemanaISO = [];

            for (let i = 0; i < 6; i++) {
                let dataLoop = new Date(dataInicioSemana);
                dataLoop.setDate(dataInicioSemana.getDate() + i);
                let isoDate = formataDataISO(dataLoop);
                datasDaSemanaISO.push(isoDate);

                let isToday = (isoDate === hojeISO);
                let classToday = isToday ? 'today' : '';
                let tagHoje = isToday ? `<span class="tag base" style="background: var(--status-success-bg); color: var(--status-success);">Hoje</span>` : '';

                headerHTML += `
                <div class="day-header ${classToday}">
                    <div class="day-info">
                        <span class="day-name">${diasDaSemana[dataLoop.getDay()]}</span>
                        <span class="day-date">${dataLoop.getDate()} ${meses[dataLoop.getMonth()]}</span>
                    </div>
                    ${tagHoje}
                </div>`;
            }
            gridContainer.innerHTML += headerHTML;

            // 2. LINHAS DOS COLABORADORES
            usuariosExibicao.forEach((colab) => {
                let fotoUrl = colab.foto || 'https://via.placeholder.com/40';

                let rowHTML = `
                <div class="user-cell">
                    <img src="${fotoUrl}" class="user-avatar-circle" alt="Foto">
                    <div class="user-info">
                        <span class="user-name">${colab.nome ? colab.nome.split(' ')[0] : colab.email}</span>
                        <span class="user-role">${colab.perfil || 'Colaborador'}</span>
                    </div>
                </div>`;

                datasDaSemanaISO.forEach(dataLoopStr => {
                    let bgStyle = (dataLoopStr === hojeISO) ? 'background: rgba(99, 102, 241, 0.02);' : '';
                    rowHTML += `<div class="task-lane" style="${bgStyle}">`;

                    Object.keys(listaTarefasGlobal).forEach(taskId => {
                        let task = listaTarefasGlobal[taskId];

                        if (task.colaboradorEmail === colab.email && task.data === dataLoopStr) {
                            let classPriority = task.tipo === 'Urgente' ? 'priority-high' : (task.tipo === 'Extra' ? 'priority-low' : '');
                            let tagStyle = task.tipo === 'Urgente' ? 'style="background: #fee2e2; color: #991b1b;"' : (task.tipo === 'Extra' ? 'style="background: #fef3c7; color: #b45309;"' : '');
                            let isDoneClass = task.status === 'Concluída' ? 'is-done' : '';
                            let isChecked = task.status === 'Concluída' ? 'checked' : '';

                            rowHTML += `
                            <div class="task-card ${classPriority} ${isDoneClass}">
                                <div class="task-header"><div class="tags"><span class="tag base" ${tagStyle}>${task.tipo}</span></div></div>
                                <h4 class="task-title">${task.titulo}</h4>
                                <div class="task-footer">
                                    <label class="custom-checkbox" onclick="event.stopPropagation()">
                                        <input type="checkbox" data-id="${taskId}" class="task-updater" ${isChecked}>
                                        <span class="checkmark"></span>
                                        <span class="status-text">${task.status}</span>
                                    </label>
                                </div>
                            </div>`;
                        }
                    });

                    if (perfilUsuario === "Gestor") {
                        rowHTML += `<button class="add-task-btn" onclick="abrirModalDemanda('${dataLoopStr}')">+ Adicionar</button>`;
                    }
                    rowHTML += `</div>`;
                });

                gridContainer.innerHTML += rowHTML;
            });

            // VINCULAR EVENTO DE ATUALIZAÇÃO NOS CHECKBOXES
            document.querySelectorAll('.task-updater').forEach(checkbox => {
                checkbox.addEventListener('change', function () {
                    const taskId = this.getAttribute('data-id');
                    const novoStatus = this.checked ? "Concluída" : "Pendente";
                    atualizarStatusFirebase(taskId, novoStatus);
                });
            });
        }

        // ==========================================
        // NAVEGAÇÃO DA SEMANA
        // ==========================================
        document.getElementById('btn-prev-week').addEventListener('click', () => { dataInicioSemana.setDate(dataInicioSemana.getDate() - 7); renderizarGrid(); });
        document.getElementById('btn-next-week').addEventListener('click', () => { dataInicioSemana.setDate(dataInicioSemana.getDate() + 7); renderizarGrid(); });
        document.getElementById('btn-today').addEventListener('click', () => { dataInicioSemana = getStartOfWeek(new Date()); renderizarGrid(); });

        // ==========================================
        // FIREBASE CRUD
        // ==========================================
        function carregarTarefas() {
            const tarefasRef = ref(db, 'agenda_tarefas');
            onValue(tarefasRef, (snapshot) => {
                if (snapshot.exists()) {
                    listaTarefasGlobal = snapshot.val();
                    verificarEAtualizarPendentes(listaTarefasGlobal);
                } else {
                    listaTarefasGlobal = {};
                }
                renderizarGrid();
            });
        }

        document.getElementById('btnSalvarDemanda').addEventListener('click', () => {
            const titulo = document.getElementById('demanda-titulo').value;
            const colabEmail = document.getElementById('demanda-colaborador').value;
            const data = document.getElementById('demanda-data').value;
            const tipo = document.getElementById('demanda-tipo').value;

            if (!titulo || !data || !colabEmail) {
                showToast("Preencha todos os campos!", "error");
                return;
            }

            const tarefasRef = ref(db, 'agenda_tarefas');
            const novaTarefaRef = push(tarefasRef);

            set(novaTarefaRef, {
                titulo: titulo,
                colaboradorEmail: colabEmail,
                criadoPor: usuarioAtual.email,
                data: data,
                tipo: tipo,
                status: "Pendente",
                criadoEm: new Date().toISOString()
            }).then(() => {
                showToast("Tarefa atribuída com sucesso!", "success");
                fecharModalDemanda();
            }).catch((error) => {
                showToast("Erro ao criar: " + error.message, "error");
            });
        });

        function atualizarStatusFirebase(taskId, novoStatus) {
            const updateRef = ref(db, 'agenda_tarefas/' + taskId);
            update(updateRef, {
                status: novoStatus,
                atualizadoPor: usuarioAtual.email,
                atualizadoEm: new Date().toISOString()
            });
        }
    </script>
</body>

</html>
