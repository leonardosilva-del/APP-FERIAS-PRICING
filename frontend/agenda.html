<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pricing</title>
    
    <!-- FAVICON LOCAL (PADRÃO DEFINITIVO) -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/favicon.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Biblioteca SortableJS para o Drag and Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <!-- SCRIPT DO MODO DARK GLOBAL (Impede a tela de piscar branco) -->
    <script>
        if (localStorage.getItem('tema-intranet') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
        function toggleDark() {
            document.documentElement.classList.toggle('dark-theme');
            const isDark = document.documentElement.classList.contains('dark-theme');
            localStorage.setItem('tema-intranet', isDark ? 'dark' : 'light');
            
            // Troca o ícone do botão
            const btnIcon = document.getElementById('icon-theme');
            if (btnIcon) {
                btnIcon.textContent = isDark ? '☀️' : '🌙';
            }
        }
    </script>

    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --bg-swimlane: #f8fafc;
            --text-900: #0f172a;
            --text-600: #475569;
            --text-400: #94a3b8;
            --border-light: #e2e8f0;
            --border-hover: #cbd5e1;
            --brand-primary: #6366f1;
            --brand-primary-hover: #4f46e5;
            --brand-secondary: #8b5cf6;
            --status-success: #10b981;
            --status-success-bg: #d1fae5;
            --status-warning: #f59e0b;
            --status-danger: #ef4444;
            --status-danger-hover: #dc2626;
            --status-info: #0ea5e9;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
        }

        /* --- MODO DARK --- */
        html.dark-theme {
            --bg-body: #0f172a;         /* Fundo slate escuro */
            --bg-surface: #1e293b;      /* Superfícies / Cards */
            --bg-swimlane: #0f172a;     /* Colunas / Faixas */
            --text-900: #f8fafc;        /* Texto principal claro */
            --text-600: #94a3b8;        /* Texto secundário */
            --text-400: #64748b;        /* Texto sutil */
            --border-light: #334155;    /* Bordas escuras */
            --border-hover: #475569;
            --status-success-bg: #064e3b; /* Ajuste para etiquetas não ofuscarem */
        }

        /* Pequeno ajuste extra para Inputs e Modais ficarem perfeitos no Dark Mode */
        html.dark-theme .task-card { background: #1e293b; }
        html.dark-theme .task-card.is-done { background: #0f172a; border-left-color: #059669; }
        html.dark-theme .modal-content input, 
        html.dark-theme .modal-content select, 
        html.dark-theme .modal-content textarea {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        html.dark-theme .modal-content input::placeholder, 
        html.dark-theme .modal-content textarea::placeholder {
            color: #64748b !important;
        }
        html.dark-theme .modal-content select:disabled { background-color: #334155 !important; color: #94a3b8 !important; }
        html.dark-theme .check-dias-semana label { background: #1e293b; border-color: #334155; color: #f8fafc; }
        
        /* Ajuste do fundo dos comentários no Modo Dark */
        html.dark-theme .comment-bubble { background: #334155; color: #f8fafc; }
        html.dark-theme .comment-bubble.is-me { background: rgba(139, 92, 246, 0.2); }
        /* Fim Modo Dark */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-900);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- WIDGET DE PERFIL --- */
        .user-profile-widget {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-surface);
            padding: 6px 16px 6px 6px;
            border-radius: 50px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-light);
            transition: all 0.2s ease;
        }

        .user-profile-widget:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--brand-primary);
            object-fit: cover;
        }

        .user-info-widget {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .user-name-widget {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-900);
            line-height: 1.2;
        }

        .user-role-widget {
            font-size: 0.7rem;
            color: var(--text-400);
            line-height: 1.2;
        }

        .btn-logout-widget {
            background: transparent;
            border: none;
            color: var(--text-400);
            padding: 6px;
            margin-left: 4px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-logout-widget:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-600);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            transition: all 0.2s;
            border: 1px solid var(--border-light);
            background-color: var(--bg-swimlane);
        }

        .back-btn:hover {
            background-color: var(--bg-surface);
            color: var(--text-900);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-sm);
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: var(--shadow-md);
            animation: slideIn 0.3s forwards;
            pointer-events: auto;
        }

        .toast.success { background-color: var(--status-success); }
        .toast.error { background-color: var(--status-danger); }
        .toast.info { background-color: var(--status-info); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* MODAIS REUTILIZÁVEIS E BOTÕES PADRONIZADOS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: var(--bg-surface);
            padding: 30px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: var(--shadow-lg);
            box-sizing: border-box;
            position: relative;
        }
        
        /* PROTEÇÃO UNIVERSAL CONTRA ESMAGAMENTO DE LAYOUT */
        .modal-content > * {
            flex-shrink: 0;
        }

        .modal-content.large {
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: var(--text-400);
            cursor: pointer;
        }

        .modal-header-close:hover { color: var(--text-900); }

        .modal-content h2 {
            margin: 0 0 10px 0;
            color: var(--text-900);
            font-size: 1.5rem;
            text-align: center;
        }

        .modal-content label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-600);
            margin-bottom: -10px;
        }

        .modal-content input,
        .modal-content select,
        .modal-content textarea {
            padding: 12px;
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            background: var(--bg-swimlane);
            resize: vertical;
        }
        
        .modal-content select:disabled {
            background-color: #e2e8f0;
            cursor: not-allowed;
            color: var(--text-600);
        }

        .modal-content input:focus,
        .modal-content select:focus,
        .modal-content textarea:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            background: var(--bg-surface);
        }

        /* Checkbox Dias Semana para Rotina Fixa */
        .check-dias-semana {
            display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px;
        }
        .check-dias-semana label {
            display: flex; align-items: center; gap: 4px; font-weight: 500; font-size: 0.8rem;
            background: var(--bg-surface); border: 1px solid var(--border-light); padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .check-dias-semana input:checked + span {
            color: var(--brand-primary); font-weight: 700;
        }
        .check-dias-semana input {
            accent-color: var(--brand-primary); width: 14px; height: 14px;
        }

        /* Padronização Universal de Botões do Modal para não amassar */
        .btn-save, .btn-cancel, .btn-secondary {
            padding: 12px 15px;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            flex-shrink: 0;
            min-height: 44px;
        }
        
        .btn-save { background-color: var(--brand-primary); color: white; }
        .btn-save:hover { background-color: var(--brand-primary-hover); }
        .btn-cancel { background-color: var(--bg-swimlane); color: var(--text-600); border: 1px solid var(--border-light); }
        .btn-cancel:hover { background-color: var(--border-light); color: var(--text-900); }
        
        .btn-secondary { background-color: var(--bg-swimlane); color: var(--brand-primary); border-color: var(--brand-primary); }
        .btn-secondary:hover { background-color: rgba(99, 102, 241, 0.05); }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            width: 100%;
        }

        .modal-buttons button {
            flex: 1;
        }

        /* DETALHES E COMENTÁRIOS DA TAREFA */
        .task-detail-info {
            background: var(--bg-swimlane);
            padding: 15px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            color: var(--text-600);
            border: 1px solid var(--border-light);
        }
        
        .task-detail-info strong { color: var(--text-900); }

        .comments-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .comment-bubble {
            background: #f1f5f9;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-900);
            border-left: 3px solid var(--brand-primary);
        }
        
        .comment-bubble.is-me {
            margin-left: 20px;
            border-left: none;
            border-right: 3px solid var(--brand-secondary);
            background: #f3e8ff;
        }
        
        .comment-bubble.is-other {
            margin-right: 20px;
        }

        .comment-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-400);
            margin-bottom: 5px;
            font-weight: 600;
        }

        /* Estrutura Core */
        .topbar {
            background: var(--bg-surface);
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            z-index: 30;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-900);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo img {
            height: 38px;
            object-fit: contain;
        }

        .week-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-body);
            padding: 0.25rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-600);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: var(--bg-surface);
            color: var(--text-900);
            box-shadow: var(--shadow-sm);
        }

        /* BTN DE TEMA ESPECIAL */
        .btn-theme {
            background: var(--bg-swimlane);
            border: 1px solid var(--border-light);
            font-size: 1.1rem;
            padding: 0.4rem;
            border-radius: 8px;
            margin-left: 10px;
        }

        .week-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-600);
            padding: 0 0.5rem;
            min-width: 130px;
            text-align: center;
        }

        .topbar-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.6rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-nav-today {
            background: var(--bg-surface);
            color: var(--text-600);
            border-color: var(--border-light);
        }

        .btn-nav-today:hover {
            border-color: var(--border-hover);
            color: var(--text-900);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary-top {
            background: var(--brand-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-primary-top:hover {
            background: var(--brand-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        .workspace {
            flex: 1;
            padding: 1.5rem 2rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .board-container {
            flex: 1;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            overflow: auto;
            position: relative;
        }

        .board-grid {
            display: grid;
            grid-template-columns: 200px repeat(6, minmax(230px, 1fr));
            min-width: max-content;
        }

        .day-header {
            position: sticky;
            top: 0;
            background: var(--bg-surface);
            padding: 1rem;
            border-bottom: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .day-header.sticky-left {
            left: 0;
            z-index: 30;
            background: var(--bg-surface);
        }

        .day-info {
            display: flex;
            flex-direction: column;
        }

        .day-name {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-400);
            font-weight: 600;
        }

        .day-date {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-900);
            margin-top: 0.1rem;
        }

        .day-header.today {
            border-bottom: 3px solid var(--brand-primary);
        }

        .day-header.today .day-date {
            color: var(--brand-primary);
        }

        .user-cell {
            position: sticky;
            left: 0;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            padding: 1rem 1.25rem;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }

        .user-avatar-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--brand-primary);
            object-fit: cover;
            flex-shrink: 0;
        }

        .user-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-900);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .user-role {
            font-size: 0.75rem;
            color: var(--text-400);
            margin-top: 0.1rem;
            white-space: nowrap;
        }

        .day-cell-wrapper {
            background: var(--bg-swimlane);
            border-right: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            min-width: 0; 
        }

        .task-lane {
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 120px;
            flex: 1; 
        }

        .sortable-ghost {
            opacity: 0.4;
            background-color: #f8fafc;
            border: 2px dashed var(--brand-primary) !important;
        }

        .task-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: grab;
            position: relative;
            border-left: 3px solid var(--brand-primary);
        }

        .task-card:active {
            cursor: grabbing;
        }

        .task-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--border-hover);
        }

        .task-card.priority-high { border-left-color: var(--status-danger); }
        .task-card.priority-low { border-left-color: var(--status-info); }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .tags {
            display: flex;
            gap: 0.4rem;
        }

        .tag {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .tag.base { background: #e0e7ff; color: #4338ca; }

        .task-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-900);
            line-height: 1.4;
            margin-bottom: 0.75rem;
        }

        .task-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-light);
            padding-top: 0.5rem;
            margin-top: auto;
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-600);
            font-weight: 500;
        }

        .custom-checkbox input { display: none; }

        .checkmark {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-hover);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .custom-checkbox input:checked+.checkmark {
            background-color: var(--status-success);
            border-color: var(--status-success);
        }

        .custom-checkbox input:checked+.checkmark::after {
            content: "✓";
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .task-card.is-done {
            background: var(--bg-swimlane);
            border-left-color: var(--status-success);
            opacity: 0.8;
        }

        .task-card.is-done .task-title {
            text-decoration: line-through;
            color: var(--text-400);
        }

        .add-task-btn {
            border: 1px dashed var(--border-hover);
            background: transparent;
            color: var(--text-400);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .add-task-btn:hover {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
            background: rgba(99, 102, 241, 0.05);
        }
    </style>
</head>

<body>

    <div id="toast-container"></div>

    <!-- Modal Nova Demanda -->
    <div id="modalDemanda" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
            <h2>Nova Demanda</h2>

            <label>O que precisa ser feito?</label>
            <input type="text" id="demanda-titulo" placeholder="Ex: Análise de Preços">

    <main class="workspace">

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { ref, onValue, push, set, update, remove, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        // Ajusta o ícone inicial com base no tema salvo
        document.addEventListener('DOMContentLoaded', () => {
            const isDark = localStorage.getItem('tema-intranet') === 'dark';
            const btnIcon = document.getElementById('icon-theme');
            if (btnIcon) btnIcon.textContent = isDark ? '☀️' : '🌙';
        });

        // ==========================================
        // VARIÁVEIS GLOBAIS
        // ==========================================
        let usuarioAtual = null;
        let perfilUsuario = "Colaborador";
        let listaUsuariosGlobal = [];
        let listaTarefasGlobal = {};
        let listaFixasGlobal = {};
        let dataInicioSemana = getStartOfWeek(new Date());
        let idTarefaDetalhe = null; 
        let currentSortables = []; 
        let rolagemInicialFeita = false; 

        let loadedFixas = false;
        let loadedTarefas = false;
        let loadedUsuarios = false;

        const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        const diasDaSemana = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

        // ==========================================
        // UI & UTILITÁRIOS
        // ==========================================
        window.showToast = function (message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'fadeOut 0.3s forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        window.abrirModalDemanda = function (dataPadrao = "") {
            document.getElementById('modalDemanda').style.display = 'flex';
            document.getElementById('demanda-titulo').value = '';
            document.getElementById('demanda-descricao').value = '';
            document.getElementById('demanda-data').value = dataPadrao || formataDataISO(new Date());
            
            document.getElementById('chk-demanda-fixa').checked = false;
            window.toggleDiasFixos();
            
            const selectColab = document.getElementById('demanda-colaborador');
            if (perfilUsuario !== "Gestor" && usuarioAtual) {
                selectColab.value = usuarioAtual.email;
                selectColab.disabled = true;
            } else {
                selectColab.disabled = false;
            }
        }

        window.fecharModalDemanda = function () {
            document.getElementById('modalDemanda').style.display = 'none';
        }

        window.fecharModalDetalhe = function () {
            document.getElementById('modalDetalhe').style.display = 'none';
            idTarefaDetalhe = null;
        }

        window.abrirDetalhesTarefa = function (taskId) {
            idTarefaDetalhe = taskId;
            const task = listaTarefasGlobal[taskId];
            if(!task) return;
            
            document.getElementById('detalhe-titulo').textContent = task.titulo || '';
            document.getElementById('detalhe-responsavel').textContent = task.colaboradorEmail || '';
            document.getElementById('detalhe-criador').textContent = task.criadoPor || '';
            document.getElementById('detalhe-status').textContent = task.status || '';
            document.getElementById('detalhe-descricao').value = task.descricao || '';
            
            document.getElementById('novo-comentario').value = '';
            document.getElementById('modalDetalhe').style.display = 'flex';

            renderizarComentarios(taskId);
        }

        window.salvarDescricaoFirebase = function() {
            if(!idTarefaDetalhe) return;
            const desc = document.getElementById('detalhe-descricao').value.trim();
            
            update(ref(db, `agenda_tarefas/${idTarefaDetalhe}`), {
                descricao: desc
            }).then(() => {
                window.showToast("Descrição atualizada!", "success");
            }).catch(err => {
                window.showToast("Erro ao salvar descrição: " + err.message, "error");
            });
        }

        window.excluirFixa = function(id) {
            let updates = {};
            updates['agenda_fixas/' + id] = null;
            
            Object.keys(listaTarefasGlobal).forEach(taskId => {
                let t = listaTarefasGlobal[taskId];
                if (t && t.idFixaRef === id && t.status === "Pendente") {
                    updates['agenda_tarefas/' + taskId] = null; 
                }
            });

            update(ref(db), updates).then(() => {
                showToast('Rotina fixa removida com sucesso', 'success');
            }).catch(err => {
                showToast("Erro: " + err.message, "error");
            });
        }

        window.excluirTarefaAtual = function() {
            if(!idTarefaDetalhe) return;
            
            const task = listaTarefasGlobal[idTarefaDetalhe];
            if(!task) return;
            
            if (task.idFixaRef) {
                const deletarSerieCompleta = confirm("⚠️ ATENÇÃO: Esta é uma tarefa de ROTINA FIXA.\n\n[ OK ] - Para excluir TODA A SÉRIE (essa e as futuras).\n[ CANCELAR ] - Para excluir APENAS a tarefa de hoje.");
                
                if (deletarSerieCompleta) {
                    window.excluirFixa(task.idFixaRef);
                    window.fecharModalDetalhe();
                    return;
                } else {
                    if(confirm("Tem certeza que deseja excluir APENAS A OCORRência DESTE DIA?")) {
                        let updates = {};
                        updates['agenda_tarefas/' + idTarefaDetalhe] = null;
                        if (task.dataReferencia) {
                            updates[`agenda_fixas/${task.idFixaRef}/suprimidas/${task.dataReferencia}`] = true;
                        }

                        update(ref(db), updates).then(() => {
                            window.showToast("Tarefa do dia excluída", "success");
                            window.fecharModalDetalhe();
                        }).catch(err => {
                            window.showToast("Erro: " + err.message, "error");
                        });
                    }
                }
            } else {
                if(confirm("Tem certeza que deseja excluir esta tarefa do quadro?")) {
                    let updates = {};
                    updates['agenda_tarefas/' + idTarefaDetalhe] = null;

                    update(ref(db), updates).then(() => {
                        window.showToast("Tarefa excluída", "success");
                        window.fecharModalDetalhe();
                    }).catch(err => {
                        window.showToast("Erro: " + err.message, "error");
                    });
                }
            }
        }

        window.toggleDiasFixos = function() {
            const isFixa = document.getElementById('chk-demanda-fixa').checked;
            document.getElementById('container-data').style.display = isFixa ? 'none' : 'block';
            document.getElementById('container-dias-fixos').style.display = isFixa ? 'flex' : 'none';
        }

        function getStartOfWeek(data) {
            const d = new Date(data);
            const diaSemana = d.getDay();
            const diff = d.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function formataDataISO(data) {
            try {
                if (!data || isNaN(new Date(data).getTime())) return new Date().toISOString().split('T')[0];
                const d = new Date(data);
                const tzOffset = d.getTimezoneOffset() * 60000;
                return (new Date(d.getTime() - tzOffset)).toISOString().split('T')[0];
            } catch(e) {
                return new Date().toISOString().split('T')[0];
            }
        }

        // ==========================================
        // VERIFICAÇÃO DE AUTENTICAÇÃO E PERFIL
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "/";
                return;
            }

            usuarioAtual = user;
            document.getElementById('user-photo').src = user.photoURL || 'https://via.placeholder.com/40';
            document.getElementById('user-name-widget').textContent = user.displayName ? user.displayName.split(' ')[0] : 'Usuário';

            const userRef = ref(db, 'usuarios/' + user.uid);
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const dados = snapshot.val();
                    perfilUsuario = dados.perfil || "Colaborador";
                }

                document.getElementById('user-role-widget').textContent = perfilUsuario;
                carregarUsuarios();
                carregarBasesDeDados();
            });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = "/"; });
        });

        // ==========================================
        // CARREGAR USUÁRIOS
        // ==========================================
        function carregarUsuarios() {
            const usuariosRef = ref(db, 'usuarios');
            onValue(usuariosRef, (snapshot) => {
                listaUsuariosGlobal = [];
                const selectColab = document.getElementById('demanda-colaborador');
                selectColab.innerHTML = '';

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    Object.keys(data).forEach(uid => {
                        const u = data[uid];
                        u.uid = uid;
                        listaUsuariosGlobal.push(u);

                        if (perfilUsuario === "Gestor" || u.email === usuarioAtual.email) {
                            const option = document.createElement('option');
                            option.value = u.email || 'sem-email';
                            option.textContent = u.nome || u.email || 'Sem Nome';
                            selectColab.appendChild(option);
                        }
                    });
                }
                loadedUsuarios = true;
                agendarProcessamento();
            });
        }

        // ==========================================
        // FIREBASE CRUD: TAREFAS E FIXAS
        // ==========================================
        let debounceTimer;

        function carregarBasesDeDados() {
            onValue(ref(db, 'agenda_fixas'), (snapshot) => {
                listaFixasGlobal = snapshot.exists() ? snapshot.val() : {};
                loadedFixas = true;
                renderizarFixasUI();
                agendarProcessamento();
            });

            onValue(ref(db, 'agenda_tarefas'), (snapshot) => {
                listaTarefasGlobal = snapshot.exists() ? snapshot.val() : {};
                loadedTarefas = true;
                agendarProcessamento();
            });
        }

        // Timer de estabilização (Evita a condição de corrida)
        let primeiroProcessamento = true;

        function agendarProcessamento() {
            if (loadedFixas && loadedTarefas && loadedUsuarios) {
                // 1. Renderiza a grid imediatamente (sem debounce) para garantir que a tela nunca fique vazia
                renderizarGridSafe();

                // 2. Na primeira vez, processa a auto-manutenção (rollover/fixas) imediatamente sem debounce
                if (primeiroProcessamento) {
                    primeiroProcessamento = false;
                    clearTimeout(debounceTimer);
                    // Colocamos num setTimeout curto para permitir que a UI (grid) seja desenhada antes de travar a thread
                    setTimeout(() => processarTudo(), 50);
                    return;
                }

                // 3. Debounce para a lógica de processamento pesado quando não for a primeira vez
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    processarTudo();
                }, 400);
            }
        }

        function processarTudo() {
            let updatesPendentes = {};
            let updatesFixas = {};

            try { 
                updatesPendentes = verificarEAtualizarPendentes(listaTarefasGlobal) || {}; 
            } catch(e) { 
                console.error("Erro processando pendentes:", e); 
            }
            
            try { 
                updatesFixas = verificarEInstanciarFixas(listaFixasGlobal, listaTarefasGlobal) || {}; 
            } catch(e) { 
                console.error("Erro processando fixas:", e); 
            }
            
            // Une todas as atualizações em um único push para não enlouquecer o Firebase
            let totalUpdates = { ...updatesPendentes, ...updatesFixas };

            try {
                if (Object.keys(totalUpdates).length > 0) {
                    update(ref(db), totalUpdates).catch(e => console.error("Erro no update unificado:", e));
                }
            } catch(err) {
                console.error("Erro síncrono no update do Firebase:", err);
            }

            // Re-renderiza caso as funções acima tenham feito modificações locais (ex: novas rotinas fixas injetadas na lista)
            renderizarGridSafe();
            
            if(idTarefaDetalhe) {
                try { renderizarComentarios(idTarefaDetalhe); } catch(e) {}
            }
            
            if (!rolagemInicialFeita) {
                rolarParaHoje();
                rolagemInicialFeita = true;
            }
        }
        
        function renderizarGridSafe() {
            try {
                renderizarGrid();
            } catch(e) {
                console.error("Erro crítico ao renderizar a grid da agenda:", e);
                document.getElementById('board-grid-content').innerHTML = `<div style="padding: 30px; color: #ef4444; width: 100%;">Falha ao construir o calendário. Uma tarefa pode conter dados inválidos. Verifique o console.</div>`;
            }
        }

        // ==========================================
        // LÓGICA DE DEMANDAS FIXAS E AUTO-LIMPEZA
        // ==========================================
        function verificarEInstanciarFixas(fixas, tarefas) {
            if (!fixas || Object.keys(fixas).length === 0) return {};
            
            let novasTarefas = {};
            let apagarDuplicadas = {};

            const datasAtuais = [];
            for (let i = 0; i < 6; i++) {
                let d = new Date(dataInicioSemana);
                d.setDate(d.getDate() + i);
                datasAtuais.push({
                    iso: formataDataISO(d),
                    diaSemana: d.getDay()
                });
            }

            // LIMPEZA AUTOMÁTICA DE DUPLICAÇÕES (O "Auto-Heal")
            let mapaInstancias = {};
            Object.keys(tarefas).forEach(taskId => {
                const t = tarefas[taskId];
                if (t && t.idFixaRef && t.dataReferencia) {
                    const chave = t.idFixaRef + "_" + t.dataReferencia;
                    if (!mapaInstancias[chave]) mapaInstancias[chave] = [];
                    mapaInstancias[chave].push(taskId);
                }
            });

            Object.keys(mapaInstancias).forEach(chave => {
                const ids = mapaInstancias[chave];
                if (ids.length > 1) {
                    let idParaManter = ids[0];
                    for (let i = 1; i < ids.length; i++) {
                        const id = ids[i];
                        const t = tarefas[id];
                        const hasData = (t.comentarios && Object.keys(t.comentarios).length > 0) || (typeof t.descricao === 'string' && t.descricao.trim() !== '');
                        
                        if (hasData) {
                            apagarDuplicadas['agenda_tarefas/' + idParaManter] = null;
                            delete tarefas[idParaManter];
                            idParaManter = id; 
                        } else {
                            apagarDuplicadas['agenda_tarefas/' + id] = null;
                            delete tarefas[id];
                        }
                    }
                }
            });

            // GERAÇÃO DE NOVAS TAREFAS
            Object.keys(fixas).forEach(idFixa => {
                const fixa = fixas[idFixa];
                if (!fixa) return;
                
                const fixaDataCriacao = fixa.criadoEm ? formataDataISO(new Date(fixa.criadoEm)) : "2000-01-01";
                
                datasAtuais.forEach(dataObj => {
                    if (fixa.dias && Array.isArray(fixa.dias) && fixa.dias.includes(dataObj.diaSemana) && dataObj.iso >= fixaDataCriacao) {
                        
                        if (fixa.suprimidas && fixa.suprimidas[dataObj.iso]) return;

                        let jaExiste = false;
                        Object.values(tarefas).forEach(t => {
                            if (t && t.idFixaRef === idFixa && t.dataReferencia === dataObj.iso) jaExiste = true;
                        });
                        
                        Object.values(novasTarefas).forEach(nt => {
                            if (nt && nt.idFixaRef === idFixa && nt.dataReferencia === dataObj.iso) jaExiste = true;
                        });

                        if (!jaExiste) {
                            const newTaskId = push(ref(db, 'agenda_tarefas')).key;
                            const nova = {
                                titulo: fixa.titulo || 'Sem Título',
                                descricao: fixa.descricao || '',
                                colaboradorEmail: fixa.colaboradorEmail || 'sem-email',
                                criadoPor: 'Sistema (Rotina Fixa)',
                                data: dataObj.iso,
                                dataReferencia: dataObj.iso,
                                idFixaRef: idFixa,
                                tipo: fixa.tipo || 'Rotina',
                                status: "Pendente",
                                criadoEm: new Date().toISOString(),
                                ordem: Date.now() 
                            };
                            novasTarefas['agenda_tarefas/' + newTaskId] = nova;
                            tarefas[newTaskId] = nova; // Trava local para evitar a condição de corrida
                        }
                    }
                });
            });

            return { ...novasTarefas, ...apagarDuplicadas };
        }

        function renderizarFixasUI() {
            const listaDiv = document.getElementById('lista-fixas');
            if(!listaDiv) return;
            listaDiv.innerHTML = '';
            
            let count = 0;
            Object.keys(listaFixasGlobal).forEach(id => {
                const f = listaFixasGlobal[id];
                if (f && (perfilUsuario === 'Gestor' || f.colaboradorEmail === usuarioAtual.email)) {
                    count++;
                    const diasNomes = (f.dias && Array.isArray(f.dias)) ? f.dias.map(d => diasDaSemana[d].substring(0,3)).join(', ') : '';
                    listaDiv.innerHTML += `
                        <div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:8px 12px; border-radius:6px; margin-bottom:6px; border:1px solid #e2e8f0;">
                            <div>
                                <strong style="color:var(--text-900); font-size:0.9rem;">${f.titulo || 'Sem título'}</strong><br>
                                <span style="color:var(--brand-primary); font-weight:600; font-size:0.75rem;">${diasNomes}</span>
                            </div>
                            <button onclick="window.excluirFixa('${id}')" style="background:transparent; border:none; color:var(--danger); cursor:pointer; font-size:1.2rem;" title="Excluir Rotina Fixa">🗑️</button>
                        </div>
                    `;
                }
            });
            if(count === 0) listaDiv.innerHTML = '<p style="color:var(--text-400);">Nenhuma rotina fixa cadastrada para você.</p>';
        }

        // ==========================================
        // SALVAR NOVA DEMANDA (NORMAL OU FIXA)
        // ==========================================
        window.salvarDemanda = function() {
            const titulo = document.getElementById('demanda-titulo').value;
            const descricao = document.getElementById('demanda-descricao').value.trim();
            const selectColab = document.getElementById('demanda-colaborador');
            const colabEmail = selectColab ? selectColab.value : null;
            const tipo = document.getElementById('demanda-tipo').value;
            const isFixa = document.getElementById('chk-demanda-fixa').checked;

            if (!titulo || !colabEmail) {
                window.showToast("Preencha o título e responsável!", "error");
                return;
            }

            if (isFixa) {
                const diasSelecionados = Array.from(document.querySelectorAll('.chk-dia:checked')).map(cb => parseInt(cb.value));
                if(diasSelecionados.length === 0) {
                    window.showToast("Selecione os dias da semana para a rotina.", "error");
                    return;
                }
                
                push(ref(db, 'agenda_fixas'), {
                    titulo: titulo,
                    descricao: descricao,
                    colaboradorEmail: colabEmail,
                    criadoPor: usuarioAtual.email,
                    tipo: tipo,
                    dias: diasSelecionados,
                    criadoEm: new Date().toISOString()
                }).then(() => {
                    window.showToast("Rotina fixa criada com sucesso!", "success");
                    window.fecharModalDemanda();
                }).catch(err => {
                    window.showToast("Erro: " + err.message, "error");
                });
                
            } else {
                const data = document.getElementById('demanda-data').value;
                if(!data) {
                    window.showToast("Preencha a data da tarefa!", "error");
                    return;
                }
                
                push(ref(db, 'agenda_tarefas'), {
                    titulo: titulo,
                    descricao: descricao,
                    colaboradorEmail: colabEmail,
                    criadoPor: usuarioAtual.email,
                    data: data,
                    tipo: tipo,
                    status: "Pendente",
                    criadoEm: new Date().toISOString(),
                    ordem: Date.now()
                }).then(() => {
                    window.showToast("Tarefa atribuída com sucesso!", "success");
                    window.fecharModalDemanda();
                }).catch(err => {
                    window.showToast("Erro: " + err.message, "error");
                });
            }
        };

        // ==========================================
        // AUTOMAGIC ROLLOVER DAS PENDENTES
        // ==========================================
        function verificarEAtualizarPendentes(tarefas) {
            const hojeStr = formataDataISO(new Date());
            let updates = {};

            Object.keys(tarefas).forEach(taskId => {
                const task = tarefas[taskId];
                if (!task) return; 
                
                if (task.status === "Pendente" && task.data && task.data < hojeStr) {
                    
                    let duplicateId = null;
                    for (let id in tarefas) {
                        let t = tarefas[id];
                        if (!t) continue; 
                        if (t.data === hojeStr && t.titulo && t.titulo === task.titulo && t.colaboradorEmail === task.colaboradorEmail && id !== taskId) {
                            duplicateId = id;
                            break;
                        }
                    }

                    if (duplicateId) {
                        const dupTask = tarefas[duplicateId];
                        const oldDesc = typeof task.descricao === 'string' ? task.descricao.trim() : '';
                        const oldHasData = (task.comentarios && Object.keys(task.comentarios).length > 0) || oldDesc !== '';
                        const newDesc = typeof dupTask.descricao === 'string' ? dupTask.descricao.trim() : '';
                        const newHasData = (dupTask.comentarios && Object.keys(dupTask.comentarios).length > 0) || newDesc !== '';

                        if (!newHasData) {
                            updates['agenda_tarefas/' + duplicateId] = null;
                            tarefas[duplicateId] = null; 
                            
                            updates['agenda_tarefas/' + taskId + '/data'] = hojeStr;
                            updates['agenda_tarefas/' + taskId + '/transferidaDe'] = task.data || '';
                            updates['agenda_tarefas/' + taskId + '/transferidaEm'] = new Date().toISOString();
                            task.data = hojeStr; 
                        } else if (!oldHasData) {
                            updates['agenda_tarefas/' + taskId] = null;
                            tarefas[taskId] = null; 
                        } else {
                            updates['agenda_tarefas/' + taskId + '/data'] = hojeStr;
                            updates['agenda_tarefas/' + taskId + '/transferidaDe'] = task.data || '';
                            updates['agenda_tarefas/' + taskId + '/transferidaEm'] = new Date().toISOString();
                            task.data = hojeStr; 
                        }
                    } else {
                        updates['agenda_tarefas/' + taskId + '/data'] = hojeStr;
                        updates['agenda_tarefas/' + taskId + '/transferidaDe'] = task.data || '';
                        updates['agenda_tarefas/' + taskId + '/transferidaEm'] = new Date().toISOString();
                        task.data = hojeStr; 
                    }
                }
            });

            return updates;
        }

        // ==========================================
        // RENDERIZAR GRID DA AGENDA
        // ==========================================
        function renderizarGrid() {
            const gridContainer = document.getElementById('board-grid-content');
            
            currentSortables.forEach(s => s.destroy());
            currentSortables = [];
            gridContainer.innerHTML = '';

            const dataFimSemana = new Date(dataInicioSemana);
            dataFimSemana.setDate(dataInicioSemana.getDate() + 5);
            document.getElementById('week-label').textContent = `${dataInicioSemana.getDate()} ${meses[dataInicioSemana.getMonth()]} - ${dataFimSemana.getDate()} ${meses[dataFimSemana.getMonth()]}`;

            const hojeISO = formataDataISO(new Date());

            let usuariosExibicao = [];
            if (perfilUsuario === "Gestor") {
                usuariosExibicao = listaUsuariosGlobal;
            } else {
                usuariosExibicao = listaUsuariosGlobal.filter(u => u.email === usuarioAtual.email);
                if (usuariosExibicao.length === 0 && usuarioAtual) {
                    usuariosExibicao = [{
                        uid: usuarioAtual.uid,
                        nome: usuarioAtual.displayName,
                        email: usuarioAtual.email,
                        foto: usuarioAtual.photoURL,
                        perfil: perfilUsuario
                    }];
                }
            }

            let headerHTML = `<div class="day-header sticky-left"><span style="font-weight: 600; color: var(--text-600); font-size: 0.85rem;">Equipe (${usuariosExibicao.length})</span></div>`;
            let datasDaSemanaISO = [];

            for (let i = 0; i < 6; i++) {
                let dataLoop = new Date(dataInicioSemana);
                dataLoop.setDate(dataInicioSemana.getDate() + i);
                let isoDate = formataDataISO(dataLoop);
                datasDaSemanaISO.push(isoDate);

                let isToday = (isoDate === hojeISO);
                let classToday = isToday ? 'today' : '';
                let tagHoje = isToday ? `<span class="tag base" style="background: var(--status-success-bg); color: var(--status-success);">Hoje</span>` : '';

                headerHTML += `
                <div class="day-header ${classToday}">
                    <div class="day-info">
                        <span class="day-name">${diasDaSemana[dataLoop.getDay()]}</span>
                        <span class="day-date">${dataLoop.getDate()} ${meses[dataLoop.getMonth()]}</span>
                    </div>
                    ${tagHoje}
                </div>`;
            }
            gridContainer.innerHTML += headerHTML;

            usuariosExibicao.forEach((colab) => {
                let fotoUrl = colab.foto || 'https://via.placeholder.com/40';
                let emailLimpo = (colab.email || "sem-email").replace(/[^a-zA-Z0-9]/g, '');

                let rowHTML = `
                <div class="user-cell">
                    <img src="${fotoUrl}" class="user-avatar-circle" alt="Foto">
                    <div class="user-info">
                        <span class="user-name" title="${colab.nome || ''}">${colab.nome ? colab.nome.split(' ')[0] : (colab.email || 'Usuário')}</span>
                        <span class="user-role">${colab.perfil || 'Colaborador'}</span>
                    </div>
                </div>`;

                datasDaSemanaISO.forEach(dataLoopStr => {
                    let bgStyle = (dataLoopStr === hojeISO) ? 'background: rgba(99, 102, 241, 0.02);' : '';
                    let uidUnicoLane = `lane-${emailLimpo}-${dataLoopStr}`;
                    
                    rowHTML += `<div class="day-cell-wrapper" style="${bgStyle}">`;
                    rowHTML += `<div class="task-lane sortable-lane" id="${uidUnicoLane}" data-email="${colab.email || ''}" data-date="${dataLoopStr}">`;

                    let tarefasColuna = Object.keys(listaTarefasGlobal)
                        .map(key => ({ id: key, ...listaTarefasGlobal[key] }))
                        .filter(t => t && t.colaboradorEmail === colab.email && t.data === dataLoopStr)
                        .sort((a, b) => (a.ordem || 0) - (b.ordem || 0));

                    tarefasColuna.forEach(task => {
                        let classPriority = task.tipo === 'Urgente' ? 'priority-high' : (task.tipo === 'Extra' ? 'priority-low' : '');
                        let tagStyle = task.tipo === 'Urgente' ? 'style="background: #fee2e2; color: #991b1b;"' : (task.tipo === 'Extra' ? 'style="background: #fef3c7; color: #b45309;"' : '');
                        let isDoneClass = task.status === 'Concluída' ? 'is-done' : '';
                        let isChecked = task.status === 'Concluída' ? 'checked' : '';

                        let commentsCount = task.comentarios ? Object.keys(task.comentarios).length : 0;
                        let commentsBadge = commentsCount > 0 ? `<span style="font-size:0.75rem; font-weight:700; color:var(--brand-primary); background:rgba(99,102,241,0.1); padding:2px 6px; border-radius:10px;">💬 ${commentsCount}</span>` : '';

                        rowHTML += `
                        <div class="task-card ${classPriority} ${isDoneClass}" data-id="${task.id}" onclick="window.abrirDetalhesTarefa('${task.id}')">
                            <div class="task-header">
                                <div class="tags"><span class="tag base" ${tagStyle}>${task.tipo || 'Rotina'}</span></div>
                                ${commentsBadge}
                            </div>
                            <h4 class="task-title">${task.titulo || 'Sem título'}</h4>
                            <div class="task-footer">
                                <label class="custom-checkbox" onclick="event.stopPropagation()">
                                    <input type="checkbox" data-id="${task.id}" class="task-updater" ${isChecked}>
                                    <span class="checkmark"></span>
                                    <span class="status-text">${task.status || 'Pendente'}</span>
                                </label>
                            </div>
                        </div>`;
                    });

                    rowHTML += `</div>`; 

                    if (perfilUsuario === "Gestor" || (colab.email && usuarioAtual && colab.email === usuarioAtual.email)) {
                        rowHTML += `<div style="padding: 0 0.75rem 0.75rem 0.75rem;"><button class="add-task-btn" style="width: 100%;" onclick="window.abrirModalDemanda('${dataLoopStr}')">+ Adicionar</button></div>`;
                    } else {
                        rowHTML += `<div style="padding: 0 0.75rem 0.75rem 0.75rem;"></div>`;
                    }

                    rowHTML += `</div>`; 
                });

                gridContainer.innerHTML += rowHTML;
            });

            iniciarDragAndDrop();

            document.querySelectorAll('.task-updater').forEach(checkbox => {
                checkbox.addEventListener('change', function () {
                    const taskId = this.getAttribute('data-id');
                    const novoStatus = this.checked ? "Concluída" : "Pendente";
                    atualizarStatusFirebase(taskId, novoStatus);
                });
            });
        }

        function rolarParaHoje() {
            setTimeout(() => {
                const colunaHoje = document.querySelector('.day-header.today');
                const container = document.querySelector('.board-container');
                
                if (colunaHoje && container) {
                    container.scrollTo({
                        left: colunaHoje.offsetLeft - 220, 
                        behavior: 'smooth'
                    });
                }
            }, 150); 
        }

        function iniciarDragAndDrop() {
            const lanes = document.querySelectorAll('.sortable-lane');
            lanes.forEach(lane => {
                const isMyLane = perfilUsuario === "Gestor" || (usuarioAtual && lane.getAttribute('data-email') === usuarioAtual.email);
                
                if(isMyLane) {
                    const sortableInstance = new Sortable(lane, {
                        group: 'shared', 
                        animation: 150,
                        ghostClass: 'sortable-ghost',
                        onEnd: function (evt) {
                            const taskId = evt.item.getAttribute('data-id');
                            const novaLane = evt.to;
                            const novoColab = novaLane.getAttribute('data-email');
                            const novaData = novaLane.getAttribute('data-date');
                            
                            let updates = {};
                            
                            updates[`agenda_tarefas/${taskId}/colaboradorEmail`] = novoColab;
                            updates[`agenda_tarefas/${taskId}/data`] = novaData;
                            
                            const cards = Array.from(novaLane.querySelectorAll('.task-card'));
                            cards.forEach((card, index) => {
                                const id = card.getAttribute('data-id');
                                updates[`agenda_tarefas/${id}/ordem`] = Date.now() + index; 
                            });

                            update(ref(db), updates).catch(err => {
                                window.showToast("Erro ao reordenar: " + err.message, "error");
                            });
                        }
                    });
                    currentSortables.push(sortableInstance);
                }
            });
        }

        document.getElementById('btn-prev-week').addEventListener('click', () => { 
            dataInicioSemana.setDate(dataInicioSemana.getDate() - 7); 
            agendarProcessamento();
        });
        document.getElementById('btn-next-week').addEventListener('click', () => { 
            dataInicioSemana.setDate(dataInicioSemana.getDate() + 7); 
            agendarProcessamento();
        });
        document.getElementById('btn-today').addEventListener('click', () => { 
            dataInicioSemana = getStartOfWeek(new Date()); 
            agendarProcessamento();
            rolarParaHoje(); 
        });

        function atualizarStatusFirebase(taskId, novoStatus) {
            const updateRef = ref(db, 'agenda_tarefas/' + taskId);
            update(updateRef, {
                status: novoStatus,
                atualizadoPor: usuarioAtual.email,
                atualizadoEm: new Date().toISOString()
            });
        }

        // ==========================================
        // FIREBASE CRUD COMENTÁRIOS DA TAREFA
        // ==========================================
        document.getElementById('btnSalvarComentario').addEventListener('click', () => {
            if (!idTarefaDetalhe) return;
            
            const texto = document.getElementById('novo-comentario').value.trim();
            if (!texto) {
                window.showToast("Digite algo para comentar", "warning");
                return;
            }

            const comentariosRef = ref(db, `agenda_tarefas/${idTarefaDetalhe}/comentarios`);
            const novoComentarioRef = push(comentariosRef);

            set(novoComentarioRef, {
                texto: texto,
                autor: usuarioAtual.displayName ? usuarioAtual.displayName.split(' ')[0] : 'Usuário',
                autorEmail: usuarioAtual.email,
                dataHora: new Date().toLocaleString('pt-BR')
            }).then(() => {
                document.getElementById('novo-comentario').value = '';
            }).catch(err => {
                window.showToast("Erro ao enviar", "error");
            });
        });

        function renderizarComentarios(taskId) {
            const listaDiv = document.getElementById('comentarios-lista');
            listaDiv.innerHTML = '';
            
            const task = listaTarefasGlobal[taskId];
            if (!task || !task.comentarios) {
                listaDiv.innerHTML = '<p style="text-align:center; color:var(--text-400); font-size:0.85rem; margin-top:10px;">Sem comentários ainda.</p>';
                return;
            }

            const comentariosArray = Object.values(task.comentarios);
            comentariosArray.forEach(c => {
                if (!c) return;
                const isMe = c.autorEmail === usuarioAtual.email;
                const extraClass = isMe ? 'is-me' : 'is-other';
                
                listaDiv.innerHTML += `
                    <div class="comment-bubble ${extraClass}">
                        <div class="comment-meta">
                            <span>${c.autor || 'Usuário'}</span>
                            <span>${c.dataHora || ''}</span>
                        </div>
                        <div>${c.texto || ''}</div>
                    </div>
                `;
            });

            listaDiv.scrollTop = listaDiv.scrollHeight;
        }

    </script>
</body>
