<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Pricing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --bg-swimlane: #f8fafc;
            --text-900: #0f172a;
            --text-600: #475569;
            --text-400: #94a3b8;
            --border-light: #e2e8f0;
            --border-hover: #cbd5e1;
            --brand-primary: #6366f1;
            --brand-primary-hover: #4f46e5;
            --brand-secondary: #8b5cf6;
            --status-success: #10b981;
            --status-success-bg: #d1fae5;
            --status-warning: #f59e0b;
            --status-danger: #ef4444;
            --status-danger-hover: #dc2626;
            --status-info: #0ea5e9;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-900);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- WIDGET DE PERFIL --- */
        .user-profile-widget {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-surface);
            padding: 6px 16px 6px 6px;
            border-radius: 50px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-light);
            transition: all 0.2s ease;
        }

        .user-profile-widget:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--brand-primary);
            object-fit: cover;
        }

        .user-info-widget {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .user-name-widget {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-900);
            line-height: 1.2;
        }

        .user-role-widget {
            font-size: 0.7rem;
            color: var(--text-400);
            line-height: 1.2;
        }

        .btn-logout-widget {
            background: transparent;
            border: none;
            color: var(--text-400);
            padding: 6px;
            margin-left: 4px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-logout-widget:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        .back-btn {
            text-decoration: none;
            color: var(--text-600);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            transition: all 0.2s;
            border: 1px solid var(--border-light);
            background-color: var(--bg-swimlane);
        }

        .back-btn:hover {
            background-color: var(--bg-surface);
            color: var(--text-900);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-sm);
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: var(--shadow-md);
            animation: slideIn 0.3s forwards;
            pointer-events: auto;
        }

        .toast.success { background-color: var(--status-success); }
        .toast.error { background-color: var(--status-danger); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* MODAIS REUTILIZÁVEIS */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
            box-sizing: border-box;
            backdrop-filter: blur(2px);
        }

        .modal-content {
            background: var(--bg-surface);
            padding: 30px;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: var(--shadow-lg);
            box-sizing: border-box;
            position: relative;
        }

        .modal-content.large {
            max-width: 550px;
            max-height: 90vh;
        }

        .modal-header-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: transparent;
            border: none;
            font-size: 1.5rem;
            color: var(--text-400);
            cursor: pointer;
        }

        .modal-header-close:hover { color: var(--text-900); }

        .modal-content h2 {
            margin: 0 0 10px 0;
            color: var(--text-900);
            font-size: 1.5rem;
            text-align: center;
        }

        .modal-content label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-600);
            margin-bottom: -10px;
        }

        .modal-content input,
        .modal-content select,
        .modal-content textarea {
            padding: 12px;
            border: 1px solid var(--border-hover);
            border-radius: var(--radius-md);
            font-family: inherit;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            outline: none;
            background: var(--bg-swimlane);
            resize: none;
        }

        .modal-content input:focus,
        .modal-content select:focus,
        .modal-content textarea:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
            background: var(--bg-surface);
        }

        /* Checkbox Dias Semana para Rotina Fixa */
        .check-dias-semana {
            display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px;
        }
        .check-dias-semana label {
            display: flex; align-items: center; gap: 4px; font-weight: 500; font-size: 0.8rem;
            background: #fff; border: 1px solid var(--border-light); padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .check-dias-semana input:checked + span {
            color: var(--brand-primary); font-weight: 700;
        }
        .check-dias-semana input {
            accent-color: var(--brand-primary); width: 14px; height: 14px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-save { background-color: var(--brand-primary); color: white; }
        .btn-save:hover { background-color: var(--brand-primary-hover); }
        .btn-cancel { background-color: var(--bg-swimlane); color: var(--text-600); border: 1px solid var(--border-light); }
        .btn-cancel:hover { background-color: var(--border-light); color: var(--text-900); }

        /* DETALHES E COMENTÁRIOS DA TAREFA */
        .task-detail-info {
            background: var(--bg-swimlane);
            padding: 15px;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            color: var(--text-600);
            border: 1px solid var(--border-light);
        }
        
        .task-detail-info strong { color: var(--text-900); }

        .comments-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .comment-bubble {
            background: #f1f5f9;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-900);
            border-left: 3px solid var(--brand-primary);
        }

        .comment-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: var(--text-400);
            margin-bottom: 5px;
            font-weight: 600;
        }

        /* Estrutura Core */
        .topbar {
            background: var(--bg-surface);
            padding: 0.75rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            z-index: 30;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-900);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .logo img {
            height: 38px;
            object-fit: contain;
        }

        .week-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-body);
            padding: 0.25rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-600);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: var(--bg-surface);
            color: var(--text-900);
            box-shadow: var(--shadow-sm);
        }

        .week-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-600);
            padding: 0 0.5rem;
            min-width: 130px;
            text-align: center;
        }

        .topbar-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.6rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-secondary {
            background: var(--bg-surface);
            color: var(--text-600);
            border-color: var(--border-light);
        }

        .btn-secondary:hover {
            border-color: var(--border-hover);
            color: var(--text-900);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary {
            background: var(--brand-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-primary:hover {
            background: var(--brand-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        .workspace {
            flex: 1;
            padding: 1.5rem 2rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .board-container {
            flex: 1;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            overflow: auto;
            position: relative;
        }

        .board-grid {
            display: grid;
            grid-template-columns: 280px repeat(6, minmax(280px, 1fr));
            min-width: max-content;
        }

        .day-header {
            position: sticky;
            top: 0;
            background: var(--bg-surface);
            padding: 1rem;
            border-bottom: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .day-header.sticky-left {
            left: 0;
            z-index: 30;
            background: var(--bg-surface);
        }

        .day-info {
            display: flex;
            flex-direction: column;
        }

        .day-name {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-400);
            font-weight: 600;
        }

        .day-date {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-900);
            margin-top: 0.1rem;
        }

        .day-header.today {
            border-bottom: 3px solid var(--brand-primary);
        }

        .day-header.today .day-date {
            color: var(--brand-primary);
        }

        .user-cell {
            position: sticky;
            left: 0;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            padding: 1.5rem;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-avatar-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--brand-primary);
            object-fit: cover;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-900);
        }

        .user-role {
            font-size: 0.75rem;
            color: var(--text-400);
            margin-top: 0.1rem;
        }

        .task-lane {
            padding: 1rem;
            background: var(--bg-swimlane);
            border-right: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 180px;
        }

        .task-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            border-left: 3px solid var(--brand-primary);
        }

        .task-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--border-hover);
        }

        .task-card.priority-high { border-left-color: var(--status-danger); }
        .task-card.priority-low { border-left-color: var(--status-info); }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .tags {
            display: flex;
            gap: 0.4rem;
        }

        .tag {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .tag.base { background: #e0e7ff; color: #4338ca; }

        .task-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-900);
            line-height: 1.4;
            margin-bottom: 0.75rem;
        }

        .task-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-light);
            padding-top: 0.5rem;
            margin-top: auto;
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-600);
            font-weight: 500;
        }

        .custom-checkbox input { display: none; }

        .checkmark {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-hover);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .custom-checkbox input:checked+.checkmark {
            background-color: var(--status-success);
            border-color: var(--status-success);
        }

        .custom-checkbox input:checked+.checkmark::after {
            content: "✓";
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .task-card.is-done {
            background: #f8fafc;
            border-left-color: var(--status-success);
            opacity: 0.8;
        }

        .task-card.is-done .task-title {
            text-decoration: line-through;
            color: var(--text-400);
        }

        .add-task-btn {
            border: 1px dashed var(--border-hover);
            background: transparent;
            color: var(--text-400);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: auto;
        }

        .add-task-btn:hover {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
            background: rgba(99, 102, 241, 0.05);
        }
    </style>
</head>

<body>

    <div id="toast-container"></div>

    <!-- Modal Nova Demanda -->
    <div id="modalDemanda" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-height: 90vh; overflow-y: auto;">
            <h2>Nova Demanda</h2>

            <label>O que precisa ser feito?</label>
            <input type="text" id="demanda-titulo" placeholder="Ex: Análise de Preços">

            <label>Responsável</label>
            <select id="demanda-colaborador">
                <!-- Injetado via JS com usuários do Firebase -->
            </select>

            <label>Prioridade/Tipo</label>
            <select id="demanda-tipo">
                <option value="Rotina">Rotina (Azul)</option>
                <option value="Extra">Demanda Extra (Amarelo)</option>
                <option value="Urgente">Urgente (Vermelho)</option>
            </select>

            <!-- OPÇÃO DE TAREFA FIXA -->
            <div style="margin-top: 10px; margin-bottom: 5px; padding: 12px; background: rgba(99, 102, 241, 0.05); border: 1px dashed var(--brand-primary); border-radius: 8px;">
                <label class="custom-checkbox" style="margin-bottom: 0;">
                    <input type="checkbox" id="chk-demanda-fixa" onchange="window.toggleDiasFixos()">
                    <span class="checkmark"></span>
                    <span style="font-weight: 600; color: var(--brand-primary);">📌 Tornar Demanda Fixa (Recorrente)</span>
                </label>
                
                <div id="container-dias-fixos" class="check-dias-semana" style="display: none; margin-top: 12px;">
                    <label><input type="checkbox" class="chk-dia" value="1"> <span>Seg</span></label>
                    <label><input type="checkbox" class="chk-dia" value="2"> <span>Ter</span></label>
                    <label><input type="checkbox" class="chk-dia" value="3"> <span>Qua</span></label>
                    <label><input type="checkbox" class="chk-dia" value="4"> <span>Qui</span></label>
                    <label><input type="checkbox" class="chk-dia" value="5"> <span>Sex</span></label>
                    <label><input type="checkbox" class="chk-dia" value="6"> <span>Sáb</span></label>
                </div>
            </div>

            <!-- CONTAINER DATA ESPECÍFICA -->
            <div id="container-data" style="margin-top: 5px;">
                <label>Data Específica</label>
                <input type="date" id="demanda-data">
            </div>

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModalDemanda()">Cancelar</button>
                <button class="btn-save" id="btnSalvarDemanda">Salvar Tarefa</button>
            </div>

            <!-- LISTA DE DEMANDAS FIXAS (VISÍVEL PRA GERENCIAR) -->
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid var(--border-light);">
            <h3 style="font-size: 0.95rem; color: var(--text-900); margin-bottom:10px;">📌 Suas Demandas Fixas Ativas</h3>
            <div id="lista-fixas" style="max-height: 150px; overflow-y: auto; font-size: 0.85rem;">
                <!-- Injetado via JS -->
            </div>
        </div>
    </div>

    <!-- Modal Detalhes e Chat da Demanda -->
    <div id="modalDetalhe" class="modal-overlay" style="display: none;">
        <div class="modal-content large">
            <button class="modal-header-close" onclick="fecharModalDetalhe()">×</button>
            <h2>Detalhes da Demanda</h2>
            
            <div class="task-detail-info">
                <p style="margin-bottom: 5px;"><strong>Título:</strong> <span id="detalhe-titulo"></span></p>
                <p style="margin-bottom: 5px;"><strong>Responsável:</strong> <span id="detalhe-responsavel"></span></p>
                <p style="margin-bottom: 5px;"><strong>Criado por:</strong> <span id="detalhe-criador"></span></p>
                <p style="margin-bottom: 0;"><strong>Status Atual:</strong> <span id="detalhe-status" style="font-weight: bold; color: var(--brand-primary);"></span></p>
            </div>

            <h3 style="font-size: 1rem; color: var(--text-900); margin-top: 10px; margin-bottom: 5px;">Comentários e Histórico</h3>
            <div id="comentarios-lista" class="comments-section">
                <!-- Comentários injetados aqui -->
            </div>

            <div style="margin-top: 10px;">
                <textarea id="novo-comentario" placeholder="Escreva um comentário ou atualização sobre esta tarefa..." style="height: 60px; margin-bottom: 10px;"></textarea>
                <button class="btn-save" id="btnSalvarComentario" style="width: 100%;">Enviar Comentário</button>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-cancel" style="flex:1;" onclick="fecharModalDetalhe()">Fechar Aba</button>
                <button id="btnExcluirTarefa" class="btn-cancel" style="flex:1; color: var(--danger); border-color: var(--danger);" onclick="excluirTarefaAtual()">🗑️ Excluir Tarefa</button>
            </div>
        </div>
    </div>

    <!-- Topbar -->
    <header class="topbar">
        <div class="topbar-left">
            <a href="/" class="back-btn" title="Voltar ao Menu Principal">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg> Voltar
            </a>
            <div class="logo" style="margin-left: 10px;">
                <img src="/logo.png" alt="Dia a Dia"> Agenda Pricing
            </div>

            <div class="week-selector">
                <button class="btn-icon" id="btn-prev-week" title="Semana Anterior">❮</button>
                <span class="week-label" id="week-label">Carregando...</span>
                <button class="btn-icon" id="btn-next-week" title="Próxima Semana">❯</button>
            </div>
            <button class="btn btn-secondary" id="btn-today"
                style="padding: 0.4rem 0.8rem; font-size: 0.75rem;">Hoje</button>
        </div>

        <div class="topbar-actions">
            <!-- Botão de Nova Demanda visível para TODOS agora! -->
            <button class="btn btn-primary" id="btnAbrirModal" onclick="abrirModalDemanda()" style="display: inline-flex;">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Nova Demanda
            </button>

            <!-- WIDGET DE PERFIL DO USUÁRIO -->
            <div class="user-profile-widget">
                <img id="user-photo" src="" class="user-avatar" alt="Foto">
                <div class="user-info-widget">
                    <span id="user-name-widget" class="user-name-widget">Carregando...</span>
                    <span id="user-role-widget" class="user-role-widget">Colaborador</span>
                </div>
                <button id="btn-logout" class="btn-logout-widget" title="Sair da Intranet">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="workspace">
        <div class="board-container">
            <div class="board-grid" id="board-grid-content">
                <!-- O JavaScript injeta as colunas e tarefas aqui -->
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { ref, onValue, push, set, update, remove, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        // ==========================================
        // VARIÁVEIS GLOBAIS
        // ==========================================
        let usuarioAtual = null;
        let perfilUsuario = "Colaborador";
        let listaUsuariosGlobal = [];
        let listaTarefasGlobal = {};
        let listaFixasGlobal = {};
        let dataInicioSemana = getStartOfWeek(new Date());
        let idTarefaDetalhe = null; 

        let loadedFixas = false;
        let loadedTarefas = false;

        const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        const diasDaSemana = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

        // ==========================================
        // UI & UTILITÁRIOS
        // ==========================================
        window.showToast = function (message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'fadeOut 0.3s forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        window.abrirModalDemanda = function (dataPadrao = "") {
            document.getElementById('modalDemanda').style.display = 'flex';
            document.getElementById('demanda-titulo').value = '';
            document.getElementById('demanda-data').value = dataPadrao || formataDataISO(new Date());
            
            document.getElementById('chk-demanda-fixa').checked = false;
            window.toggleDiasFixos();
            
            // Se o usuário logado for Colaborador, trava a seleção de responsável nele mesmo
            if (perfilUsuario !== "Gestor" && usuarioAtual) {
                const selectColab = document.getElementById('demanda-colaborador');
                selectColab.value = usuarioAtual.email;
            }
        }

        window.fecharModalDemanda = function () {
            document.getElementById('modalDemanda').style.display = 'none';
        }

        window.fecharModalDetalhe = function () {
            document.getElementById('modalDetalhe').style.display = 'none';
            idTarefaDetalhe = null;
        }

        window.abrirDetalhesTarefa = function (taskId) {
            idTarefaDetalhe = taskId;
            const task = listaTarefasGlobal[taskId];
            
            document.getElementById('detalhe-titulo').textContent = task.titulo;
            document.getElementById('detalhe-responsavel').textContent = task.colaboradorEmail;
            document.getElementById('detalhe-criador').textContent = task.criadoPor;
            document.getElementById('detalhe-status').textContent = task.status;
            
            document.getElementById('novo-comentario').value = '';
            document.getElementById('modalDetalhe').style.display = 'flex';

            renderizarComentarios(taskId);
        }

        window.excluirTarefaAtual = function() {
            if(!idTarefaDetalhe) return;
            if(confirm("Tem certeza que deseja excluir esta tarefa específica do quadro?")) {
                remove(ref(db, 'agenda_tarefas/' + idTarefaDetalhe)).then(() => {
                    showToast("Tarefa excluída", "success");
                    fecharModalDetalhe();
                });
            }
        }

        window.toggleDiasFixos = function() {
            const isFixa = document.getElementById('chk-demanda-fixa').checked;
            document.getElementById('container-data').style.display = isFixa ? 'none' : 'block';
            document.getElementById('container-dias-fixos').style.display = isFixa ? 'flex' : 'none';
        }

        function getStartOfWeek(data) {
            const d = new Date(data);
            const diaSemana = d.getDay();
            const diff = d.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        function formataDataISO(data) {
            const tzOffset = (new Date()).getTimezoneOffset() * 60000;
            return (new Date(data - tzOffset)).toISOString().split('T')[0];
        }

        // ==========================================
        // VERIFICAÇÃO DE AUTENTICAÇÃO E PERFIL
        // ==========================================
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "/";
                return;
            }

            usuarioAtual = user;

            document.getElementById('user-photo').src = user.photoURL || 'https://via.placeholder.com/40';
            document.getElementById('user-name-widget').textContent = user.displayName ? user.displayName.split(' ')[0] : 'Usuário';

            const userRef = ref(db, 'usuarios/' + user.uid);
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    const dados = snapshot.val();
                    perfilUsuario = dados.perfil || "Colaborador";
                }

                document.getElementById('user-role-widget').textContent = perfilUsuario;

                carregarUsuarios();
                carregarBasesDeDados();
            });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = "/"; });
        });

        // ==========================================
        // CARREGAR USUÁRIOS
        // ==========================================
        function carregarUsuarios() {
            const usuariosRef = ref(db, 'usuarios');
            onValue(usuariosRef, (snapshot) => {
                listaUsuariosGlobal = [];
                const selectColab = document.getElementById('demanda-colaborador');
                selectColab.innerHTML = '';

                if (snapshot.exists()) {
                    const data = snapshot.val();
                    Object.keys(data).forEach(uid => {
                        const u = data[uid];
                        u.uid = uid;
                        listaUsuariosGlobal.push(u);

                        if (perfilUsuario === "Gestor" || u.email === usuarioAtual.email) {
                            const option = document.createElement('option');
                            option.value = u.email;
                            option.textContent = u.nome || u.email;
                            selectColab.appendChild(option);
                        }
                    });
                }
                if(loadedTarefas) renderizarGrid();
            });
        }

        // ==========================================
        // FIREBASE CRUD: TAREFAS E FIXAS
        // ==========================================
        function carregarBasesDeDados() {
            // Carrega Templates de Rotinas Fixas
            onValue(ref(db, 'agenda_fixas'), (snapshot) => {
                listaFixasGlobal = snapshot.exists() ? snapshot.val() : {};
                loadedFixas = true;
                renderizarFixasUI();
                if (loadedTarefas) processarTudo();
            });

            // Carrega as Instâncias das Tarefas
            onValue(ref(db, 'agenda_tarefas'), (snapshot) => {
                listaTarefasGlobal = snapshot.exists() ? snapshot.val() : {};
                loadedTarefas = true;
                if (loadedFixas) processarTudo();
            });
        }

        function processarTudo() {
            verificarEAtualizarPendentes(listaTarefasGlobal);
            verificarEInstanciarFixas(listaFixasGlobal, listaTarefasGlobal);
            renderizarGrid();
            if(idTarefaDetalhe) renderizarComentarios(idTarefaDetalhe);
        }

        // ==========================================
        // LÓGICA DE DEMANDAS FIXAS (INSTANCIAÇÃO)
        // ==========================================
        function verificarEInstanciarFixas(fixas, tarefas) {
            if (!fixas || Object.keys(fixas).length === 0) return;
            
            let novasTarefas = {};
            let precisaAtualizar = false;

            const datasAtuais = [];
            for (let i = 0; i < 6; i++) {
                let d = new Date(dataInicioSemana);
                d.setDate(d.getDate() + i);
                datasAtuais.push({
                    iso: formataDataISO(d),
                    diaSemana: d.getDay() // 0=Dom, 1=Seg, 2=Ter, 3=Qua, 4=Qui, 5=Sex, 6=Sab
                });
            }

            Object.keys(fixas).forEach(idFixa => {
                const fixa = fixas[idFixa];
                
                datasAtuais.forEach(dataObj => {
                    if (fixa.dias && fixa.dias.includes(dataObj.diaSemana)) {
                        let jaExiste = false;
                        Object.values(tarefas).forEach(t => {
                            if (t.idFixaRef === idFixa && t.dataReferencia === dataObj.iso) {
                                jaExiste = true;
                            }
                        });

                        if (!jaExiste) {
                            const newTaskId = push(ref(db, 'agenda_tarefas')).key;
                            const nova = {
                                titulo: fixa.titulo,
                                colaboradorEmail: fixa.colaboradorEmail,
                                criadoPor: 'Sistema (Rotina Fixa)',
                                data: dataObj.iso,
                                dataReferencia: dataObj.iso,
                                idFixaRef: idFixa,
                                tipo: fixa.tipo,
                                status: "Pendente",
                                criadoEm: new Date().toISOString()
                            };
                            novasTarefas['agenda_tarefas/' + newTaskId] = nova;
                            tarefas[newTaskId] = nova; // Previne recriação imediata na mesma execução
                            precisaAtualizar = true;
                        }
                    }
                });
            });

            if (precisaAtualizar) {
                update(ref(db), novasTarefas);
            }
        }

        function renderizarFixasUI() {
            const listaDiv = document.getElementById('lista-fixas');
            if(!listaDiv) return;
            listaDiv.innerHTML = '';
            
            let count = 0;
            Object.keys(listaFixasGlobal).forEach(id => {
                const f = listaFixasGlobal[id];
                if (perfilUsuario === 'Gestor' || f.colaboradorEmail === usuarioAtual.email) {
                    count++;
                    const diasNomes = f.dias.map(d => diasDaSemana[d].substring(0,3)).join(', ');
                    listaDiv.innerHTML += `
                        <div style="display:flex; justify-content:space-between; align-items:center; background:#f8fafc; padding:8px 12px; border-radius:6px; margin-bottom:6px; border:1px solid #e2e8f0;">
                            <div>
                                <strong style="color:var(--text-900); font-size:0.9rem;">${f.titulo}</strong><br>
                                <span style="color:var(--brand-primary); font-weight:600; font-size:0.75rem;">${diasNomes}</span>
                            </div>
                            <button onclick="excluirFixa('${id}')" style="background:transparent; border:none; color:var(--danger); cursor:pointer; font-size:1.2rem;" title="Excluir Rotina Fixa">🗑️</button>
                        </div>
                    `;
                }
            });
            if(count === 0) listaDiv.innerHTML = '<p style="color:var(--text-400);">Nenhuma rotina fixa cadastrada para você.</p>';
        }

        window.excluirFixa = function(id) {
            if(confirm('Excluir essa demanda fixa? Ela NÃO será mais gerada nas próximas semanas.')) {
                remove(ref(db, 'agenda_fixas/' + id)).then(() => showToast('Rotina fixa removida', 'success'));
            }
        }

        // ==========================================
        // SALVAR NOVA DEMANDA (NORMAL OU FIXA)
        // ==========================================
        document.getElementById('btnSalvarDemanda').addEventListener('click', () => {
            const titulo = document.getElementById('demanda-titulo').value;
            const colabEmail = document.getElementById('demanda-colaborador').value;
            const tipo = document.getElementById('demanda-tipo').value;
            const isFixa = document.getElementById('chk-demanda-fixa').checked;

            if (!titulo || !colabEmail) {
                showToast("Preencha o título e responsável!", "error");
                return;
            }

            if (isFixa) {
                const diasSelecionados = Array.from(document.querySelectorAll('.chk-dia:checked')).map(cb => parseInt(cb.value));
                if(diasSelecionados.length === 0) {
                    showToast("Selecione os dias da semana para a rotina.", "error");
                    return;
                }
                
                push(ref(db, 'agenda_fixas'), {
                    titulo: titulo,
                    colaboradorEmail: colabEmail,
                    criadoPor: usuarioAtual.email,
                    tipo: tipo,
                    dias: diasSelecionados,
                    criadoEm: new Date().toISOString()
                }).then(() => {
                    showToast("Rotina fixa criada com sucesso!", "success");
                    fecharModalDemanda();
                    verificarEInstanciarFixas(listaFixasGlobal, listaTarefasGlobal);
                    renderizarGrid();
                });
                
            } else {
                const data = document.getElementById('demanda-data').value;
                if(!data) {
                    showToast("Preencha a data da tarefa!", "error");
                    return;
                }
                
                push(ref(db, 'agenda_tarefas'), {
                    titulo: titulo,
                    colaboradorEmail: colabEmail,
                    criadoPor: usuarioAtual.email,
                    data: data,
                    tipo: tipo,
                    status: "Pendente",
                    criadoEm: new Date().toISOString()
                }).then(() => {
                    showToast("Tarefa atribuída com sucesso!", "success");
                    fecharModalDemanda();
                });
            }
        });

        // ==========================================
        // AUTOMAGIC ROLLOVER DAS PENDENTES
        // ==========================================
        function verificarEAtualizarPendentes(tarefas) {
            const hojeStr = formataDataISO(new Date());
            let houveAtualizacao = false;
            let updates = {};

            Object.keys(tarefas).forEach(taskId => {
                const task = tarefas[taskId];
                
                if (task.status === "Pendente" && task.data < hojeStr) {
                    updates['agenda_tarefas/' + taskId + '/data'] = hojeStr;
                    updates['agenda_tarefas/' + taskId + '/transferidaDe'] = task.data;
                    updates['agenda_tarefas/' + taskId + '/transferidaEm'] = new Date().toISOString();
                    
                    task.data = hojeStr; // impede loop local
                    houveAtualizacao = true;
                }
            });

            if (houveAtualizacao) {
                update(ref(db), updates).then(() => {
                    window.showToast("Tarefas pendentes rolaram para hoje!", "info");
                });
            }
        }

        // ==========================================
        // RENDERIZAR GRID DA AGENDA
        // ==========================================
        function renderizarGrid() {
            const gridContainer = document.getElementById('board-grid-content');
            gridContainer.innerHTML = '';

            const dataFimSemana = new Date(dataInicioSemana);
            dataFimSemana.setDate(dataInicioSemana.getDate() + 5);
            document.getElementById('week-label').textContent = `${dataInicioSemana.getDate()} ${meses[dataInicioSemana.getMonth()]} - ${dataFimSemana.getDate()} ${meses[dataFimSemana.getMonth()]}`;

            const hojeISO = formataDataISO(new Date());

            let usuariosExibicao = [];
            if (perfilUsuario === "Gestor") {
                usuariosExibicao = listaUsuariosGlobal;
            } else {
                usuariosExibicao = listaUsuariosGlobal.filter(u => u.email === usuarioAtual.email);
                if (usuariosExibicao.length === 0 && usuarioAtual) {
                    usuariosExibicao = [{
                        uid: usuarioAtual.uid,
                        nome: usuarioAtual.displayName,
                        email: usuarioAtual.email,
                        foto: usuarioAtual.photoURL,
                        perfil: perfilUsuario
                    }];
                }
            }

            let headerHTML = `<div class="day-header sticky-left"><span style="font-weight: 600; color: var(--text-600); font-size: 0.85rem;">Equipe (${usuariosExibicao.length})</span></div>`;
            let datasDaSemanaISO = [];

            for (let i = 0; i < 6; i++) {
                let dataLoop = new Date(dataInicioSemana);
                dataLoop.setDate(dataInicioSemana.getDate() + i);
                let isoDate = formataDataISO(dataLoop);
                datasDaSemanaISO.push(isoDate);

                let isToday = (isoDate === hojeISO);
                let classToday = isToday ? 'today' : '';
                let tagHoje = isToday ? `<span class="tag base" style="background: var(--status-success-bg); color: var(--status-success);">Hoje</span>` : '';

                headerHTML += `
                <div class="day-header ${classToday}">
                    <div class="day-info">
                        <span class="day-name">${diasDaSemana[dataLoop.getDay()]}</span>
                        <span class="day-date">${dataLoop.getDate()} ${meses[dataLoop.getMonth()]}</span>
                    </div>
                    ${tagHoje}
                </div>`;
            }
            gridContainer.innerHTML += headerHTML;

            usuariosExibicao.forEach((colab) => {
                let fotoUrl = colab.foto || 'https://via.placeholder.com/40';

                let rowHTML = `
                <div class="user-cell">
                    <img src="${fotoUrl}" class="user-avatar-circle" alt="Foto">
                    <div class="user-info">
                        <span class="user-name">${colab.nome ? colab.nome.split(' ')[0] : colab.email}</span>
                        <span class="user-role">${colab.perfil || 'Colaborador'}</span>
                    </div>
                </div>`;

                datasDaSemanaISO.forEach(dataLoopStr => {
                    let bgStyle = (dataLoopStr === hojeISO) ? 'background: rgba(99, 102, 241, 0.02);' : '';
                    rowHTML += `<div class="task-lane" style="${bgStyle}">`;

                    Object.keys(listaTarefasGlobal).forEach(taskId => {
                        let task = listaTarefasGlobal[taskId];

                        if (task.colaboradorEmail === colab.email && task.data === dataLoopStr) {
                            let classPriority = task.tipo === 'Urgente' ? 'priority-high' : (task.tipo === 'Extra' ? 'priority-low' : '');
                            let tagStyle = task.tipo === 'Urgente' ? 'style="background: #fee2e2; color: #991b1b;"' : (task.tipo === 'Extra' ? 'style="background: #fef3c7; color: #b45309;"' : '');
                            let isDoneClass = task.status === 'Concluída' ? 'is-done' : '';
                            let isChecked = task.status === 'Concluída' ? 'checked' : '';

                            let commentsCount = task.comentarios ? Object.keys(task.comentarios).length : 0;
                            let commentsBadge = commentsCount > 0 ? `<span style="font-size:0.75rem; font-weight:700; color:var(--brand-primary); background:rgba(99,102,241,0.1); padding:2px 6px; border-radius:10px;">💬 ${commentsCount}</span>` : '';

                            rowHTML += `
                            <div class="task-card ${classPriority} ${isDoneClass}" onclick="abrirDetalhesTarefa('${taskId}')">
                                <div class="task-header">
                                    <div class="tags"><span class="tag base" ${tagStyle}>${task.tipo}</span></div>
                                    ${commentsBadge}
                                </div>
                                <h4 class="task-title">${task.titulo}</h4>
                                <div class="task-footer">
                                    <label class="custom-checkbox" onclick="event.stopPropagation()">
                                        <input type="checkbox" data-id="${taskId}" class="task-updater" ${isChecked}>
                                        <span class="checkmark"></span>
                                        <span class="status-text">${task.status}</span>
                                    </label>
                                </div>
                            </div>`;
                        }
                    });

                    if (perfilUsuario === "Gestor" || colab.email === usuarioAtual.email) {
                        rowHTML += `<button class="add-task-btn" onclick="abrirModalDemanda('${dataLoopStr}')">+ Adicionar</button>`;
                    }
                    rowHTML += `</div>`;
                });

                gridContainer.innerHTML += rowHTML;
            });

            document.querySelectorAll('.task-updater').forEach(checkbox => {
                checkbox.addEventListener('change', function () {
                    const taskId = this.getAttribute('data-id');
                    const novoStatus = this.checked ? "Concluída" : "Pendente";
                    atualizarStatusFirebase(taskId, novoStatus);
                });
            });
        }

        document.getElementById('btn-prev-week').addEventListener('click', () => { 
            dataInicioSemana.setDate(dataInicioSemana.getDate() - 7); 
            verificarEInstanciarFixas(listaFixasGlobal, listaTarefasGlobal);
            renderizarGrid(); 
        });
        document.getElementById('btn-next-week').addEventListener('click', () => { 
            dataInicioSemana.setDate(dataInicioSemana.getDate() + 7); 
            verificarEInstanciarFixas(listaFixasGlobal, listaTarefasGlobal);
            renderizarGrid(); 
        });
        document.getElementById('btn-today').addEventListener('click', () => { 
            dataInicioSemana = getStartOfWeek(new Date()); 
            verificarEInstanciarFixas(listaFixasGlobal, listaTarefasGlobal);
            renderizarGrid(); 
        });

        function atualizarStatusFirebase(taskId, novoStatus) {
            const updateRef = ref(db, 'agenda_tarefas/' + taskId);
            update(updateRef, {
                status: novoStatus,
                atualizadoPor: usuarioAtual.email,
                atualizadoEm: new Date().toISOString()
            });
        }

        // ==========================================
        // FIREBASE CRUD COMENTÁRIOS DA TAREFA
        // ==========================================
        document.getElementById('btnSalvarComentario').addEventListener('click', () => {
            if (!idTarefaDetalhe) return;
            
            const texto = document.getElementById('novo-comentario').value.trim();
            if (!texto) {
                showToast("Digite algo para comentar", "warning");
                return;
            }

            const comentariosRef = ref(db, `agenda_tarefas/${idTarefaDetalhe}/comentarios`);
            const novoComentarioRef = push(comentariosRef);

            set(novoComentarioRef, {
                texto: texto,
                autor: usuarioAtual.displayName ? usuarioAtual.displayName.split(' ')[0] : 'Usuário',
                autorEmail: usuarioAtual.email,
                dataHora: new Date().toLocaleString('pt-BR')
            }).then(() => {
                document.getElementById('novo-comentario').value = '';
            }).catch(err => {
                showToast("Erro ao enviar", "error");
            });
        });

        function renderizarComentarios(taskId) {
            const listaDiv = document.getElementById('comentarios-lista');
            listaDiv.innerHTML = '';
            
            const task = listaTarefasGlobal[taskId];
            if (!task || !task.comentarios) {
                listaDiv.innerHTML = '<p style="text-align:center; color:var(--text-400); font-size:0.85rem; margin-top:10px;">Sem comentários ainda.</p>';
                return;
            }

            const comentariosArray = Object.values(task.comentarios);
            comentariosArray.forEach(c => {
                const isMe = c.autorEmail === usuarioAtual.email;
                const alignStyle = isMe ? 'margin-left: 20px; border-left:none; border-right:3px solid var(--brand-secondary); background:#f3e8ff;' : 'margin-right: 20px;';
                
                listaDiv.innerHTML += `
                    <div class="comment-bubble" style="${alignStyle}">
                        <div class="comment-meta">
                            <span>${c.autor}</span>
                            <span>${c.dataHora}</span>
                        </div>
                        <div>${c.texto}</div>
                    </div>
                `;
            });
