<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace | Agenda Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Paleta de Cores SaaS Moderna */
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --bg-swimlane: #f8fafc;

            --text-900: #0f172a;
            --text-600: #475569;
            --text-400: #94a3b8;

            --border-light: #e2e8f0;
            --border-hover: #cbd5e1;

            --brand-primary: #6366f1;
            --brand-primary-hover: #4f46e5;
            --brand-secondary: #8b5cf6;

            --status-success: #10b981;
            --status-success-bg: #d1fae5;
            --status-warning: #f59e0b;
            --status-danger: #ef4444;
            --status-danger-hover: #dc2626;
            --status-info: #0ea5e9;

            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);

            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-900);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- PADRÃO INTRANET: BOTOES E MODAL --- */
        .back-btn {
            text-decoration: none;
            color: var(--text-600);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: var(--radius-md);
            transition: all 0.2s;
            border: 1px solid var(--border-light);
            background-color: var(--bg-swimlane);
        }

        .back-btn:hover {
            background-color: var(--bg-surface);
            color: var(--text-900);
            border-color: var(--border-hover);
            box-shadow: var(--shadow-sm);
        }

        .btn-login,
        .btn-logout {
            padding: 8px 15px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-login {
            background-color: var(--text-600);
            color: white;
        }

        .btn-login:hover {
            background-color: var(--text-900);
        }

        .btn-logout {
            background-color: var(--status-danger);
            color: white;
            display: none;
        }

        .btn-logout:hover {
            background-color: var(--status-danger-hover);
        }

        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: var(--shadow-md);
            animation: slideIn 0.3s forwards;
            pointer-events: auto;
        }

        .toast.success {
            background-color: var(--status-success);
        }

        .toast.error {
            background-color: var(--status-danger);
        }

        .toast.info {
            background-color: var(--status-info);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* --- Header Superior da Agenda --- */
        .topbar {
            background: var(--bg-surface);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-light);
            z-index: 30;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-900);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .logo-icon {
            background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
        }

        .week-selector {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--bg-body);
            padding: 0.25rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-light);
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--text-600);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: var(--bg-surface);
            color: var(--text-900);
            box-shadow: var(--shadow-sm);
        }

        .week-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-600);
            padding: 0 0.5rem;
            min-width: 130px;
            text-align: center;
        }

        .topbar-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.6rem 1.25rem;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-secondary {
            background: var(--bg-surface);
            color: var(--text-600);
            border-color: var(--border-light);
        }

        .btn-secondary:hover {
            border-color: var(--border-hover);
            color: var(--text-900);
            box-shadow: var(--shadow-sm);
        }

        .btn-primary {
            background: var(--brand-primary);
            color: white;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-primary:hover {
            background: var(--brand-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(99, 102, 241, 0.3);
        }

        /* --- Workspace Core --- */
        .workspace {
            flex: 1;
            padding: 1.5rem 2rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .board-container {
            flex: 1;
            background: var(--bg-surface);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-light);
            box-shadow: var(--shadow-sm);
            overflow: auto;
            position: relative;
        }

        /* --- Grid do Kanban --- */
        .board-grid {
            display: grid;
            grid-template-columns: 280px repeat(6, minmax(280px, 1fr));
            min-width: max-content;
        }

        /* Sticky Header dos Dias */
        .day-header {
            position: sticky;
            top: 0;
            background: var(--bg-surface);
            padding: 1rem;
            border-bottom: 1px solid var(--border-light);
            border-right: 1px solid var(--border-light);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .day-header.sticky-left {
            left: 0;
            z-index: 30;
            background: var(--bg-surface);
        }

        .day-info {
            display: flex;
            flex-direction: column;
        }

        .day-name {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-400);
            font-weight: 600;
        }

        .day-date {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-900);
            margin-top: 0.1rem;
        }

        .day-header.today {
            border-bottom: 3px solid var(--brand-primary);
        }

        .day-header.today .day-date {
            color: var(--brand-primary);
        }

        /* Célula do Colaborador (Sticky Left) */
        .user-cell {
            position: sticky;
            left: 0;
            background: var(--bg-surface);
            border-right: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            padding: 1.5rem;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .progress-ring-container {
            position: relative;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: conic-gradient(var(--status-success) var(--progress), var(--border-light) 0);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .progress-ring-inner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--bg-surface);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-900);
            position: absolute;
        }

        .user-info {
            display: flex;
            flex-direction: column;
        }

        .user-name {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-900);
        }

        .user-role {
            font-size: 0.75rem;
            color: var(--text-400);
            margin-top: 0.1rem;
        }

        /* Raias (Swimlanes) de Tarefas */
        .task-lane {
            padding: 1rem;
            background: var(--bg-swimlane);
            border-right: 1px solid var(--border-light);
            border-bottom: 1px solid var(--border-light);
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            min-height: 180px;
        }

        /* --- Cards de Tarefa --- */
        .task-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 1rem;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            border-left: 3px solid var(--brand-primary);
        }

        .task-card:hover {
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
            border-color: var(--border-hover);
        }

        .task-card.priority-high {
            border-left-color: var(--status-danger);
        }

        .task-card.priority-low {
            border-left-color: var(--status-info);
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .tags {
            display: flex;
            gap: 0.4rem;
        }

        .tag {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .tag.base {
            background: #e0e7ff;
            color: #4338ca;
        }

        .tag.extra {
            background: #fef3c7;
            color: #b45309;
        }

        .task-options {
            color: var(--text-400);
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 2px;
            border-radius: 4px;
        }

        .task-options:hover {
            background: var(--bg-body);
            color: var(--text-900);
        }

        .task-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-900);
            line-height: 1.4;
            margin-bottom: 0.75rem;
        }

        .task-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border-light);
            padding-top: 0.5rem;
            margin-top: auto;
        }

        .custom-checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 0.75rem;
            color: var(--text-600);
            font-weight: 500;
        }

        .custom-checkbox input {
            display: none;
        }

        .checkmark {
            width: 18px;
            height: 18px;
            border: 2px solid var(--border-hover);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .custom-checkbox input:checked+.checkmark {
            background-color: var(--status-success);
            border-color: var(--status-success);
        }

        .custom-checkbox input:checked+.checkmark::after {
            content: "✓";
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .task-card.is-done {
            background: #f8fafc;
            border-left-color: var(--status-success);
            opacity: 0.8;
        }

        .task-card.is-done .task-title {
            text-decoration: line-through;
            color: var(--text-400);
        }

        .add-task-btn {
            border: 1px dashed var(--border-hover);
            background: transparent;
            color: var(--text-400);
            padding: 0.75rem;
            border-radius: var(--radius-md);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: auto;
        }

        .add-task-btn:hover {
            border-color: var(--brand-primary);
            color: var(--brand-primary);
            background: rgba(99, 102, 241, 0.05);
        }
    </style>
</head>

<body>

    <div id="toast-container"></div>

    <header class="topbar">
        <div class="topbar-left">
            <a href="/" class="back-btn" title="Voltar ao Menu Principal">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

                </svg></button>
            <button class="btn btn-secondary" title="Dashboards Gerenciais"><svg width="16" height="16" fill="none"

                </svg></button>
            <button class="btn btn-primary"><svg width="16" height="16" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>Nova Demanda</button>
        </div>
    </header>

    <main class="workspace">
        <div class="board-container">
            <div class="board-grid">

                <div class="day-header sticky-left">
                    <span style="font-weight: 600; color: var(--text-600); font-size: 0.85rem;">Equipe (2)</span>
                </div>
                <!-- Dias da semana serão gerados via JS -->
                <div class="day-header" id="header-day-0">
                    <div class="day-info"><span class="day-name" id="name-day-0">Segunda</span><span class="day-date"
                            id="date-day-0">--</span></div><span class="tag base" id="tag-hoje-0"

                <div class="day-header" id="header-day-1">
                    <div class="day-info"><span class="day-name" id="name-day-1">Terça</span><span class="day-date"
                            id="date-day-1">--</span></div><span class="tag base" id="tag-hoje-1"
                        style="background: var(--status-success-bg); color: var(--status-success); display: none;">Hoje</span>
                </div>
                <div class="day-header" id="header-day-2">
                    <div class="day-info"><span class="day-name" id="name-day-2">Quarta</span><span class="day-date"
                            id="date-day-2">--</span></div><span class="tag base" id="tag-hoje-2"
                        style="background: var(--status-success-bg); color: var(--status-success); display: none;">Hoje</span>
                </div>
                <div class="day-header" id="header-day-3">
                    <div class="day-info"><span class="day-name" id="name-day-3">Quinta</span><span class="day-date"

                <div class="day-header" id="header-day-4">
                    <div class="day-info"><span class="day-name" id="name-day-4">Sexta</span><span class="day-date"
                            id="date-day-4">--</span></div><span class="tag base" id="tag-hoje-4"
                        style="background: var(--status-success-bg); color: var(--status-success); display: none;">Hoje</span>
                </div>
                <div class="day-header" id="header-day-5">
                    <div class="day-info"><span class="day-name" id="name-day-5">Sábado</span><span class="day-date"

                <!-- ================= LINHA 1 (MOCKUP) ================= -->

                    <div class="progress-ring-container" style="--progress: 85%;">

                <div class="task-lane" id="lane-0-0">
                    <div class="task-card">

                        <div class="task-footer"><label class="custom-checkbox" onclick="event.stopPropagation()"><input

                <div class="task-lane" id="lane-0-4"><button class="add-task-btn">+ Adicionar</button></div>
                <div class="task-lane" id="lane-0-5"><button class="add-task-btn">+ Adicionar</button></div>
            </div>
        </div>
    </main>

    <script>
        // --- MOTOR DO CALENDÁRIO ---
        const meses = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];
        const diasDaSemana = ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"];

        // Função para achar a Segunda-feira da semana atual
        function getStartOfWeek(data) {
            const d = new Date(data);
            const diaSemana = d.getDay();
            // Se for domingo (0), volta 6 dias. Senão, volta (diaSemana - 1) dias.
            const diff = d.getDate() - diaSemana + (diaSemana === 0 ? -6 : 1);
            return new Date(d.setDate(diff));
        }

        let dataInicioSemana = getStartOfWeek(new Date());

        function atualizarCalendario() {
            const dataFimSemana = new Date(dataInicioSemana);
            dataFimSemana.setDate(dataInicioSemana.getDate() + 5); // Adiciona 5 dias (Sábado)

            // Atualiza Label Superior (Ex: 10 Ago - 15 Ago)
            const lblInicio = `${dataInicioSemana.getDate()} ${meses[dataInicioSemana.getMonth()]}`;
            const lblFim = `${dataFimSemana.getDate()} ${meses[dataFimSemana.getMonth()]}`;
            document.getElementById('week-label').textContent = `${lblInicio} - ${lblFim}`;

            // Pega o dia exato de hoje à meia-noite para comparar
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);

            // Preenche os 6 dias da grade (Segunda a Sábado)
            for (let i = 0; i < 6; i++) {
                const dataAtualLoop = new Date(dataInicioSemana);
                dataAtualLoop.setDate(dataInicioSemana.getDate() + i);
                dataAtualLoop.setHours(0, 0, 0, 0);

                const divHeader = document.getElementById(`header-day-${i}`);
                const spanName = document.getElementById(`name-day-${i}`);
                const spanDate = document.getElementById(`date-day-${i}`);
                const spanTagHoje = document.getElementById(`tag-hoje-${i}`);

                // Remove fundo da raia para limpar resquícios
                const raia0 = document.getElementById(`lane-0-${i}`); // Mockup Colab 1
                if (raia0) raia0.style.background = 'var(--bg-swimlane)';

                // Alimenta Textos
                spanName.textContent = diasDaSemana[dataAtualLoop.getDay()];
                spanDate.textContent = `${dataAtualLoop.getDate()} ${meses[dataAtualLoop.getMonth()]}`;

                // Verifica se o dia renderizado é exatamente HOJE
                if (dataAtualLoop.getTime() === hoje.getTime()) {
                    divHeader.classList.add('today');
                    spanTagHoje.style.display = 'inline-block';
                    if (raia0) raia0.style.background = 'rgba(59, 130, 246, 0.03)'; // Fundo azul claro na coluna de hoje
                } else {
                    divHeader.classList.remove('today');
                    spanTagHoje.style.display = 'none';
                }
            }
        }

        // --- EVENTOS DOS BOTÕES ---
        document.getElementById('btn-prev-week').addEventListener('click', () => {
            dataInicioSemana.setDate(dataInicioSemana.getDate() - 7);
            atualizarCalendario();
        });

        document.getElementById('btn-next-week').addEventListener('click', () => {
            dataInicioSemana.setDate(dataInicioSemana.getDate() + 7);
            atualizarCalendario();
        });

        document.getElementById('btn-today').addEventListener('click', () => {
            dataInicioSemana = getStartOfWeek(new Date());
            atualizarCalendario();
        });

        // Inicializa o calendário ao abrir a tela
        atualizarCalendario();

        // --- INTERATIVIDADE DO CARD (Mockup) ---
        document.querySelectorAll('.custom-checkbox input').forEach(checkbox => {
            checkbox.addEventListener('change', function () {
                const card = this.closest('.task-card');
                const textSpan = this.parentElement.querySelector('.status-text');

                if (this.checked) {
                    card.classList.add('is-done');
                    textSpan.textContent = "Finalizada";
                } else {
                    card.classList.remove('is-done');
                    textSpan.textContent = "Pendente";
                }
            });
        });
    </script>
</body>

</html>
