<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniversariantes da Equipe</title>
    
    <!-- FAVICON LOCAL -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/favicon.png">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- SCRIPT DO MODO DARK GLOBAL -->
    <script>
        if (localStorage.getItem('tema-intranet') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
        function toggleDark() {
            document.documentElement.classList.toggle('dark-theme');
            const isDark = document.documentElement.classList.contains('dark-theme');
            localStorage.setItem('tema-intranet', isDark ? 'dark' : 'light');
            
            const btnIcon = document.getElementById('icon-theme');
            if (btnIcon) btnIcon.textContent = isDark ? '☀️' : '🌙';
        }
    </script>

    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --text-900: #0f172a;
            --text-600: #475569;
            --text-400: #94a3b8;
            --border-light: #e2e8f0;
            --border-hover: #cbd5e1;
            --brand-primary: #26417E; /* Azul Corporativo */
            --brand-primary-hover: #1e3362;
            --status-success: #10b981;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        html.dark-theme {
            --bg-body: #0f172a;
            --bg-surface: #1e293b;
            --text-900: #f8fafc;
            --text-600: #94a3b8;
            --text-400: #64748b;
            --border-light: #334155;
            --border-hover: #475569;
        }

        /* Ajustes do Modal pro Modo Dark */
        html.dark-theme .modal-content input, html.dark-theme .modal-content select {
            background-color: #0f172a !important; color: #f8fafc !important; border-color: #334155 !important;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg-body); color: var(--text-900);
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* TOPBAR */
        .topbar {
            background: var(--bg-surface); padding: 0.75rem 2rem; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border-light); z-index: 30; position: sticky; top: 0;
        }

        .topbar-left { display: flex; align-items: center; gap: 1.5rem; }

        .logo { font-size: 1.25rem; font-weight: 700; color: var(--text-900); display: flex; align-items: center; gap: 0.75rem; text-decoration: none; }
        .logo img { height: 38px; object-fit: contain; }

        .back-btn {
            text-decoration: none; color: var(--text-600); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500;
            padding: 8px 16px; border-radius: var(--radius-md); transition: all 0.2s; border: 1px solid var(--border-light); background-color: var(--bg-body);
        }
        .back-btn:hover { background-color: var(--bg-surface); color: var(--text-900); border-color: var(--border-hover); }

        .topbar-actions { display: flex; gap: 1rem; align-items: center; }

        .btn-theme { background: var(--bg-body); border: 1px solid var(--border-light); font-size: 1.1rem; padding: 0.4rem; border-radius: 8px; cursor: pointer; color: var(--text-900);}
        
        .btn-primary-top {
            background: var(--brand-primary); color: white; border: none; padding: 0.6rem 1.25rem; border-radius: var(--radius-md);
            font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: all 0.2s ease; display: none; align-items: center; gap: 0.5rem;
        }
        .btn-primary-top:hover { background: var(--brand-primary-hover); transform: translateY(-1px); }

        /* WIDGET DE PERFIL */
        .user-profile-widget {
            display: flex; align-items: center; gap: 12px; background: var(--bg-surface); padding: 6px 16px 6px 6px;
            border-radius: 50px; border: 1px solid var(--border-light);
        }
        .user-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--brand-primary); object-fit: cover; }
        .user-info-widget { display: flex; flex-direction: column; justify-content: center; }
        .user-name-widget { font-size: 0.85rem; font-weight: 600; color: var(--text-900); }
        .user-role-widget { font-size: 0.7rem; color: var(--text-400); }
        .btn-logout-widget { background: transparent; border: none; color: var(--text-400); cursor: pointer; margin-left: 4px; }

        /* CONTAINER PRINCIPAL */
        .workspace { flex: 1; padding: 2rem; max-width: 900px; margin: 0 auto; width: 100%; }

        .header-section { text-align: center; margin-bottom: 2.5rem; }
        .header-section h1 { font-size: 2.2rem; font-weight: 700; margin-bottom: 0.5rem; }
        .header-section p { color: var(--text-600); font-size: 1rem; }

        /* CARDS DOS ANIVERSARIANTES */
        .bday-list { display: flex; flex-direction: column; gap: 1rem; }

        .bday-card {
            background: var(--bg-surface); border: 1px solid var(--border-light); border-radius: var(--radius-lg);
            padding: 1.25rem 1.5rem; display: flex; align-items: center; gap: 1.5rem;
            box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s; position: relative; overflow: hidden;
        }
        .bday-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--border-hover); }
        
        .bday-card.is-today { border-left: 4px solid var(--status-success); background-color: rgba(16, 185, 129, 0.05); }

        .bday-avatar {
            width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; font-weight: 700; color: white; flex-shrink: 0; text-transform: uppercase;
        }

        .bday-info { flex: 1; }
        .bday-name { font-size: 1.1rem; font-weight: 700; color: var(--text-900); margin-bottom: 0.2rem; display: flex; align-items: center; gap: 8px;}
        .bday-role { font-size: 0.85rem; color: var(--text-600); font-weight: 500; }

        .bday-date-container { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .bday-date { font-size: 1.1rem; font-weight: 700; color: var(--brand-primary); }
        .bday-countdown { font-size: 0.75rem; font-weight: 600; padding: 3px 8px; border-radius: 12px; background: var(--bg-body); color: var(--text-600); }
        
        .countdown-close { background: #dcfce7; color: #059669; }
        .countdown-today { background: var(--status-success); color: white; animation: pulse 2s infinite; }

        .btn-delete {
            background: transparent; border: none; color: var(--text-400); cursor: pointer; padding: 8px;
            border-radius: 6px; margin-left: 15px; display: none; transition: 0.2s;
        }
        .btn-delete:hover { background: #fee2e2; color: #ef4444; }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6);
            display: none; align-items: center; justify-content: center; z-index: 1000; padding: 15px; backdrop-filter: blur(2px);
        }
        .modal-content {
            background: var(--bg-surface); padding: 30px; border-radius: var(--radius-lg); width: 100%; max-width: 400px;
            display: flex; flex-direction: column; gap: 15px; box-shadow: var(--shadow-md); position: relative; border: 1px solid var(--border-light);
        }
        .modal-header-close { position: absolute; top: 15px; right: 20px; background: transparent; border: none; font-size: 1.5rem; color: var(--text-400); cursor: pointer; }
        .modal-content h2 { margin: 0 0 10px 0; font-size: 1.25rem; text-align: center; }
        .modal-content label { font-size: 0.85rem; font-weight: 600; color: var(--text-600); margin-bottom: -10px; }
        .modal-content input { padding: 12px; border: 1px solid var(--border-hover); border-radius: 6px; width: 100%; font-size: 1rem; outline: none; background: var(--bg-body); color: var(--text-900); }
        .modal-content input:focus { border-color: var(--brand-primary); }
        
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .btn-cancel { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid var(--border-light); background: var(--bg-body); color: var(--text-600); font-weight: 600; cursor: pointer; }
        .btn-save { flex: 1; padding: 12px; border-radius: 6px; border: none; background: var(--brand-primary); color: white; font-weight: 600; cursor: pointer; }

        /* TOASTS */
        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { padding: 15px 20px; border-radius: 8px; color: white; font-weight: 500; font-size: 14px; animation: slideIn 0.3s forwards; }
        .toast.success { background-color: var(--status-success); }
        .toast.error { background-color: #ef4444; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        /* Empty State */
        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-400); border: 2px dashed var(--border-light); border-radius: var(--radius-lg); }

    </style>
</head>

<body>

    <div id="toast-container"></div>

    <!-- MODAL NOVO ANIVERSARIANTE -->
    <div id="modalNiver" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-header-close" onclick="fecharModal()">×</button>
            <h2>🎉 Novo Aniversariante</h2>

            <label>Nome do Colaborador:</label>
            <input type="text" id="niver-nome" placeholder="Ex: Leonardo Silva">

            <label>Cargo / Setor:</label>
            <input type="text" id="niver-cargo" placeholder="Ex: Analista de Pricing">

            <label>Data de Nascimento:</label>
            <!-- Usamos input date para facilitar, mas o sistema ignora o ano -->
            <input type="date" id="niver-data">

            <div class="modal-buttons">
                <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
                <button class="btn-save" onclick="salvarAniversariante()">Salvar Data</button>
            </div>
        </div>
    </div>

    <!-- Topbar -->
    <header class="topbar">
        <div class="topbar-left">
            <a href="/" class="back-btn" title="Voltar ao Menu Principal">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg> Voltar
            </a>
            <div class="logo">
                <img src="/logo.png" alt="Dia a Dia"> Pricing
            </div>
        </div>

        <div class="topbar-actions">
            <!-- Botão restrito a Gestores -->
            <button class="btn-primary-top" id="btn-novo-niver" onclick="abrirModal()">
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg> Adicionar
            </button>

            <button onclick="toggleDark()" class="btn-theme" title="Alternar Tema Escuro/Claro">
                <span id="icon-theme">🌙</span>
            </button>

            <div class="user-profile-widget">
                <img id="user-photo" src="" class="user-avatar" alt="Foto">
                <div class="user-info-widget">
                    <span id="user-name-widget" class="user-name-widget">Carregando...</span>
                    <span id="user-role-widget" class="user-role-widget">Colaborador</span>
                </div>
                <button id="btn-logout" class="btn-logout-widget" title="Sair">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                    </svg>
                </button>
            </div>
        </div>
    </header>

    <main class="workspace">
        <div class="header-section">
            <h1>🎂 Celebrações da Equipe</h1>
            <p>Acompanhe e celebre os aniversários do nosso time ao longo do ano.</p>
        </div>

        <div class="bday-list" id="lista-aniversariantes">
            <!-- Os cards entrarão aqui dinamicamente -->
            <div class="empty-state">Carregando as datas festivas...</div>
        </div>
    </main>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { ref, onValue, push, remove, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        const niverRef = ref(db, 'aniversariantes');
        let perfilUsuario = "Colaborador";

        // MODO DARK INICIAL
        document.addEventListener('DOMContentLoaded', () => {
            const isDark = localStorage.getItem('tema-intranet') === 'dark';
            const btnIcon = document.getElementById('icon-theme');
            if (btnIcon) btnIcon.textContent = isDark ? '☀️' : '🌙';
        });

        // UTILITÁRIOS
        window.showToast = function (message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        window.abrirModal = function() {
            document.getElementById('niver-nome').value = '';
            document.getElementById('niver-cargo').value = '';
            document.getElementById('niver-data').value = '';
            document.getElementById('modalNiver').style.display = 'flex';
        }
        
        window.fecharModal = function() {
            document.getElementById('modalNiver').style.display = 'none';
        }

        // Fecha modal ao clicar fora
        window.addEventListener('click', function(e) {
            const modal = document.getElementById('modalNiver');
            if(e.target === modal) fecharModal();
        });

        // Fecha modal ao apertar ESC no teclado
        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' || event.key === 'Esc') {
                const modal = document.getElementById('modalNiver');
                if (modal && modal.style.display === 'flex') {
                    fecharModal();
                }
            }
        });

        // AUTENTICAÇÃO
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "/";
                return;
            }

            document.getElementById('user-photo').src = user.photoURL || 'https://via.placeholder.com/40';
            document.getElementById('user-name-widget').textContent = user.displayName ? user.displayName.split(' ')[0] : 'Usuário';

            const userRef = ref(db, 'usuarios/' + user.uid);
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    perfilUsuario = snapshot.val().perfil || "Colaborador";
                }
                document.getElementById('user-role-widget').textContent = perfilUsuario;
                
                if (perfilUsuario === "Gestor") {
                    document.getElementById('btn-novo-niver').style.display = 'inline-flex';
                }

                carregarDados();
            }).catch(() => { carregarDados(); });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => { window.location.href = "/"; });
        });

        // GERADOR DE AVATAR (Letras e Cores)
        function getAvatarInitials(name) {
            let parts = name.trim().split(' ');
            if (parts.length >= 2) return (parts[0][0] + parts[parts.length-1][0]).toUpperCase();
            if (parts.length === 1 && parts[0].length >= 2) return parts[0].substring(0,2).toUpperCase();
            return 'DD';
        }

        function getAvatarColor(name) {
            const colors = ['#f87171', '#fb923c', '#f59e0b', '#10b981', '#14b8a6', '#0ea5e9', '#6366f1', '#8b5cf6', '#d946ef', '#f43f5e'];
            let hash = 0;
            for (let i = 0; i < name.length; i++) { hash = name.charCodeAt(i) + ((hash << 5) - hash); }
            return colors[Math.abs(hash) % colors.length];
        }

        // LÓGICA DE DATAS (Próximo Aniversário)
        function calcularProximoNiverEIdade(dataString) {
            // dataString no formato YYYY-MM-DD
            if(!dataString) return { diffDias: 999, stringVisual: '', ehHoje: false };
            
            const partes = dataString.split('-');
            const mesNasc = parseInt(partes[1]) - 1;
            const diaNasc = parseInt(partes[2]);

            const hoje = new Date();
            hoje.setHours(0,0,0,0);

            let proxNiver = new Date(hoje.getFullYear(), mesNasc, diaNasc);
            
            // Se já passou esse ano, o próximo é ano que vem
            if (proxNiver < hoje) {
                proxNiver.setFullYear(hoje.getFullYear() + 1);
            }

            const diffTime = proxNiver - hoje;
            const diffDias = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            const ehHoje = diffDias === 0;

            let stringCountdown = '';
            if (ehHoje) stringCountdown = '🥳 É HOJE!';
            else if (diffDias === 1) stringCountdown = 'Amanhã!';
            else if (diffDias <= 30) stringCountdown = `Faltam ${diffDias} dias`;
            else stringCountdown = `Em ${diffDias} dias`;

            return { 
                diffDias: diffDias, 
                stringCountdown: stringCountdown, 
                ehHoje: ehHoje,
                mesVisual: new Intl.DateTimeFormat('pt-BR', { month: 'long' }).format(proxNiver),
                diaVisual: String(diaNasc).padStart(2, '0')
            };
        }

        // SALVAR NO FIREBASE
        window.salvarAniversariante = function() {
            const nome = document.getElementById('niver-nome').value.trim();
            const cargo = document.getElementById('niver-cargo').value.trim();
            const data = document.getElementById('niver-data').value;

            if(!nome || !data) { showToast("Preencha o nome e a data!", "error"); return; }

            push(niverRef, {
                nome: nome,
                cargo: cargo || 'Equipe Pricing',
                data: data, // YYYY-MM-DD
                foto: ""
            }).then(() => {
                showToast("Data salva com sucesso!");
                fecharModal();
            }).catch(e => showToast("Erro: " + e.message, "error"));
        }

        window.deletarNiver = function(id) {
            if(confirm("Deseja remover este colaborador da lista?")) {
                remove(ref(db, `aniversariantes/${id}`)).then(() => showToast("Removido com sucesso!"));
            }
        }

        // LER E RENDERIZAR
        function carregarDados() {
            onValue(niverRef, (snapshot) => {
                const listaDiv = document.getElementById('lista-aniversariantes');
                listaDiv.innerHTML = '';

                if (!snapshot.exists()) {
                    listaDiv.innerHTML = `
                        <div class="empty-state">
                            <h2 style="font-size: 1.2rem; margin-bottom: 5px;">Nenhuma data cadastrada</h2>
                            <p>A gestão ainda não cadastrou os aniversários da equipe.</p>
                        </div>
                    `;
                    return;
                }

                let arr = [];
                snapshot.forEach(child => {
                    const data = child.val();
                    const calc = calcularProximoNiverEIdade(data.data);
                    arr.push({ id: child.key, ...data, calc: calc });
                });

                // Ordenar por quem faz aniversário mais cedo
                arr.sort((a, b) => a.calc.diffDias - b.calc.diffDias);

                arr.forEach(pessoa => {
                    const iniciais = getAvatarInitials(pessoa.nome);
                    const corAvatar = getAvatarColor(pessoa.nome);
                    
                    const classToday = pessoa.calc.ehHoje ? 'is-today' : '';
                    const classCountdown = pessoa.calc.ehHoje ? 'countdown-today' : (pessoa.calc.diffDias <= 30 ? 'countdown-close' : '');
                    const iconeCoroa = pessoa.calc.ehHoje ? '👑 ' : '';

                    const btnDelete = (perfilUsuario === "Gestor") ? `<button class="btn-delete" onclick="window.deletarNiver('${pessoa.id}')" title="Remover">🗑️</button>` : '';

                    listaDiv.innerHTML += `
                        <div class="bday-card ${classToday}">
                            <div class="bday-avatar" style="background-color: ${corAvatar};">
                                ${iniciais}
                            </div>
                            <div class="bday-info">
                                <h3 class="bday-name">${iconeCoroa}${pessoa.nome}</h3>
                                <p class="bday-role">${pessoa.cargo}</p>
                            </div>
                            <div class="bday-date-container">
                                <span class="bday-date">${pessoa.calc.diaVisual} de ${pessoa.calc.mesVisual}</span>
                                <span class="bday-countdown ${classCountdown}">${pessoa.calc.stringCountdown}</span>
                            </div>
                            ${btnDelete}
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
