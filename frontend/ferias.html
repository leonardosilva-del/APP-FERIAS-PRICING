<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controle de Férias</title>
  <link rel="stylesheet" href="/style.css" />
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
  </style>
</head>

<body>
  <div id="toast-container"></div>
  <div id="modalLogin" class="modal-overlay" style="display: none;">
    <div class="modal-content">
      <h2>Acesso da Gestão</h2>
      <input type="email" id="login-email" placeholder="Seu e-mail">
      <input type="password" id="login-senha" placeholder="Sua senha">
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="fecharModalLogin()">Cancelar</button>
        <button class="btn-save" onclick="fazerLogin()">Entrar</button>
      </div>
    </div>
  </div>
  <div id="root">
    <div class="header-container glass-panel">
      <div class="logo">
        <img src="/logo.png" alt="DIA A DIA ;DD" style="height: 80px; object-fit: contain;"
          onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
        <span style="display: none;">DIA <span style="font-size: 0.8em; vertical-align: super;">A</span> DIA <span
            class="logo-blue"
            style="background: #25408f; color: white; padding: 2px 8px; border-radius: 6px;">;DD</span></span>
      </div>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 1rem;">
        <a href="/"
          style="text-decoration: none; color: #475569; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; padding: 6px 12px; border-radius: 6px; transition: all 0.2s; border: 1px solid transparent;"
          onmouseover="this.style.backgroundColor='#f1f5f9'; this.style.color='#0f172a'; this.style.borderColor='#e2e8f0';"
          onmouseout="this.style.backgroundColor='transparent'; this.style.color='#475569'; this.style.borderColor='transparent';"
          title="Voltar ao Menu Principal">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18">
            </path>
          </svg>
          Voltar
        </a>
        <h1 style="margin: 0;">Controle de Férias</h1>
        <button id="btn-login-header" class="btn-login" onclick="abrirModalLogin()">Acesso Gestão</button>
        <button id="btn-logout-header" class="btn-logout" onclick="fazerLogout()">Sair (Logado)</button>
        <div style="position: relative;">
          <button type="button" class="settings-btn" id="settingsBtn" title="Configurações">⚙</button>
          <div class="settings-dropdown" id="settingsDropdown" style="display: none;">
            <div class="section-title">Tema</div>
            <label><input type="radio" name="theme" value="dark" checked /> 🌙 Escuro</label>
            <label><input type="radio" name="theme" value="light" /> ☀️ Claro</label>
          </div>
        </div>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
      <h2 style="margin: 0; color: var(--text-main);">Visão Geral</h2>
      <button id="toggleFormBtn" style="margin: 0; display: none;">+ Novo Agendamento</button>
    </div>

    <div class="glass-panel" id="agendarPanel" style="display: none;">
      <h2 id="formTitle">Agendar Férias</h2>
      <form id="vacationForm">
        <div class="form-grid">
          <div class="form-group">
            <label>Nome do Colaborador</label>
            <input type="text" id="nome" required placeholder="Ex: Thiago Nunes" />
          </div>
          <div class="form-group">
            <label>Data de Início</label>
            <input type="date" id="data_inicio" required />
          </div>
          <div class="form-group">
            <label>Data de Fim</label>
            <input type="date" id="data_fim" />
          </div>
          <div class="form-group">
            <label>Dias de Férias</label>
            <input type="number" id="dias_ferias" min="1" placeholder="Ex: 15" />
          </div>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center;">
          <button type="submit" id="submitBtn">Salvar Férias</button>
          <button type="button" id="cancelBtn" class="action-btn"
            style="display: none; margin-top: 1.5rem; border: none;">Cancelar</button>
        </div>
      </form>
    </div>

    <div class="glass-panel">
      <h2>Histórico de Férias</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Data de Início</th>
              <th>Data de Fim</th>
              <th>Dia de Retorno</th>
              <th>Dias de Férias</th>
              <th>Status</th>
              <th id="th-acoes" style="display: none;">Ações</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <tr>
              <td colspan="7" style="text-align: center; color: var(--text-muted);">Carregando...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // --- Theme & Settings ---
      const settingsBtn = document.getElementById("settingsBtn");
      const settingsDropdown = document.getElementById("settingsDropdown");
      const themeRadios = document.querySelectorAll('input[name="theme"]');

      const savedTheme = localStorage.getItem("theme") || "dark";
      document.documentElement.setAttribute("data-theme", savedTheme);
      document.querySelector(`input[name="theme"][value="${savedTheme}"]`).checked = true;

      settingsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        settingsDropdown.style.display = settingsDropdown.style.display === "none" ? "block" : "none";
      });

      document.addEventListener("click", (e) => {
        if (!settingsDropdown.contains(e.target) && e.target !== settingsBtn) {
          settingsDropdown.style.display = "none";
        }
      });

      themeRadios.forEach(radio => {
        radio.addEventListener("change", (e) => {
          const theme = e.target.value;
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem("theme", theme);
        });
      });

      // --- App Logic ---
      const form = document.getElementById("vacationForm");
      const submitBtn = document.getElementById("submitBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const formTitle = document.getElementById("formTitle");
      const tableBody = document.getElementById("tableBody");
      const toggleFormBtn = document.getElementById("toggleFormBtn");
      const agendarPanel = document.getElementById("agendarPanel");

      const inputInicio = document.getElementById("data_inicio");
      const inputFim = document.getElementById("data_fim");
      const inputDias = document.getElementById("dias_ferias");
      const inputNome = document.getElementById("nome");

      let fetchTimeout;
      let editIndex = null;
      let currentVacations = [];
      window.usuarioLogado = false;

      const calculateDates = async () => {
        const inicio = inputInicio.value;
        const fim = inputFim.value;
        const dias = inputDias.value;

        if (inicio && (fim || dias)) {
          try {
            const res = await fetch("/api/calculate", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                data_inicio: inicio,
                data_fim: fim,
                dias_ferias: dias ? parseInt(dias) : 0
              })
            });

            if (res.ok) {
              const data = await res.json();
              if (data.data_fim !== fim) inputFim.value = data.data_fim;
              if (data.dias_ferias.toString() !== dias) inputDias.value = data.dias_ferias;
            }
          } catch (err) {
            console.error("Erro no cálculo", err);
          }
        }
      };

      const handleInput = (e) => {
        if (e.target.id === "dias_ferias" && e.target.value) {
          inputFim.value = "";
        } else if (e.target.id === "data_fim" && e.target.value) {
          inputDias.value = "";
        }

        clearTimeout(fetchTimeout);
        fetchTimeout = setTimeout(calculateDates, 500);
      };

      inputInicio.addEventListener("input", handleInput);
      inputFim.addEventListener("input", handleInput);
      inputDias.addEventListener("input", handleInput);

      const formatDate = (dateStr) => {
        if (!dateStr) return "";
        const parts = dateStr.split("-");
        if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
        return dateStr;
      };

      toggleFormBtn.addEventListener("click", () => {
        if (agendarPanel.style.display === "none") {
          agendarPanel.style.display = "block";
          toggleFormBtn.innerText = "Fechar Formulário";
        } else {
          agendarPanel.style.display = "none";
          toggleFormBtn.innerText = "+ Novo Agendamento";
          cancelEdit();
        }
      });

      // LÓGICA ATUALIZADA AQUI: Carrega e ordena as férias
      const loadVacations = async () => {
        try {
          const res = await fetch("/api/vacations");
          const data = await res.json();
          currentVacations = data.data || [];

          if (currentVacations.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Nenhum registro encontrado.</td></tr>';
            return;
          }

          // ORDENAÇÃO POR DATA DE INÍCIO
          currentVacations.sort((a, b) => {
            if (!a["Data de Início"]) return 1;
            if (!b["Data de Início"]) return -1;
            const dataA = new Date(a["Data de Início"]);
            const dataB = new Date(b["Data de Início"]);
            return dataA - dataB;
          });

          tableBody.innerHTML = "";
          currentVacations.forEach((v, index) => {
            const tr = document.createElement("tr");

            let badgeClass = 'status-agendado';
            if (v.Status === 'Em Férias') badgeClass = 'status-em-ferias';
            if (v.Status === 'Finalizada') badgeClass = 'status-finalizada';

            tr.innerHTML = `
              <td>${v.Nome}</td>
              <td>${formatDate(v["Data de Início"])}</td>
              <td>${formatDate(v["Data de Fim"])}</td>
              <td>${formatDate(v["Dia de Retorno"])}</td>
              <td>${v["Dias de Férias"]}</td>
              <td><span class="status-badge ${badgeClass}">${v.Status}</span></td>
              ${window.usuarioLogado ? `
              <td>
                <button type="button" class="action-btn" onclick="window.editVacation(${v.id})">Editar</button>
                <button type="button" class="action-btn danger" onclick="window.deleteVacation(${v.id})">Excluir</button>
              </td>` : ''}
            `;
            tableBody.appendChild(tr);
          });
        } catch (err) {
          console.error(err);
          tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: #ef4444;">Erro ao carregar dados. O backend pode estar offline ou houve erro na leitura da planilha Excel.</td></tr>';
        }
      };
      window.loadVacationsGlobal = loadVacations;

      window.editVacation = (id) => {
        const v = currentVacations.find(item => item.id === id);
        if (!v) return;
        inputNome.value = v.Nome;
        inputInicio.value = v["Data de Início"];
        inputFim.value = v["Data de Fim"];
        inputDias.value = v["Dias de Férias"];

        editIndex = id;
        formTitle.innerText = "Editar Férias";
        submitBtn.innerText = "Atualizar Férias";
        cancelBtn.style.display = "block";
        agendarPanel.style.display = "block";
        toggleFormBtn.innerText = "Fechar Formulário";
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      window.deleteVacation = async (id) => {
        if (!confirm("Tem certeza que deseja excluir esse registro?")) return;

        try {
          const res = await fetch(`/api/vacations/${id}`, { method: "DELETE" });
          if (res.ok) {
            alert("Excluído com sucesso!");
            loadVacations();
            if (editIndex === id) cancelEdit();
          } else {
            const err = await res.json();
            let msg = err.detail;
            if (Array.isArray(msg)) msg = msg.map(e => "Preencha todos os campos corretamente.").join(", ");
            alert("Erro: " + msg);
          }
        } catch (err) {
          alert("Erro ao excluir.");
        }
      };

      const cancelEdit = () => {
        editIndex = null;
        form.reset();
        formTitle.innerText = "Agendar Férias";
        submitBtn.innerText = "Salvar Férias";
        cancelBtn.style.display = "none";
        agendarPanel.style.display = "none";
        toggleFormBtn.innerText = "+ Novo Agendamento";
      };

      cancelBtn.addEventListener("click", cancelEdit);

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        submitBtn.disabled = true;
        const originalText = submitBtn.innerText;
        submitBtn.innerText = "Salvando...";

        try {
          const payload = {
            nome: inputNome.value,
            data_inicio: inputInicio.value,
            data_fim: inputFim.value,
            dias_ferias: parseInt(inputDias.value || 0)
          };

          const url = editIndex !== null ? `/api/vacations/${editIndex}` : "/api/vacations";
          const method = editIndex !== null ? "PUT" : "POST";

          const res = await fetch(url, {
            method: method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          if (res.ok) {
            alert(editIndex !== null ? "Férias atualizadas!" : "Férias cadastradas com sucesso!");
            cancelEdit();
            loadVacations();
          } else {
            const err = await res.json();
            let msg = err.detail;
            if (Array.isArray(msg)) msg = msg.map(e => "Preencha todos os campos corretamente.").join(", ");
            alert("Erro: " + msg);
          }
        } catch (err) {
          alert("Erro ao conectar com o servidor.");
        } finally {
          submitBtn.disabled = false;
          submitBtn.innerText = originalText;
        }
      });

      loadVacations();
    });
  </script>
  
  <script type="module">
    // Importando a configuração centralizada
    import { auth } from "./firebase-config.js";
    import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    window.showToast = function (message, type = 'success') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      toast.innerText = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    window.abrirModalLogin = function () { document.getElementById('modalLogin').style.display = 'flex'; }
    window.fecharModalLogin = function () { document.getElementById('modalLogin').style.display = 'none'; }

    window.fazerLogin = function () {
      const email = document.getElementById('login-email').value;
      const senha = document.getElementById('login-senha').value;
      signInWithEmailAndPassword(auth, email, senha)
        .then(() => {
          fecharModalLogin();
          showToast("Acesso liberado!", "success");
        })
        .catch((err) => {
          showToast("Erro ao entrar. Verifique o e-mail e senha.", "error");
        });
    };

    window.fazerLogout = function () {
      signOut(auth).then(() => {
        showToast("Você saiu do modo gestão.", "info");
      });
    };

    onAuthStateChanged(auth, (user) => {
      const btnLogin = document.getElementById('btn-login-header');
      const btnLogout = document.getElementById('btn-logout-header');
      const btnNovo = document.getElementById('toggleFormBtn');
      const thAcoes = document.getElementById('th-acoes');

      if (user) {
        window.usuarioLogado = true;
        if (btnLogin) btnLogin.style.display = 'none';
        if (btnLogout) btnLogout.style.display = 'inline-block';
        if (btnNovo) btnNovo.style.display = 'block';
        if (thAcoes) thAcoes.style.display = 'table-cell';
      } else {
        window.usuarioLogado = false;
        if (btnLogin) btnLogin.style.display = 'inline-block';
        if (btnLogout) btnLogout.style.display = 'none';
        if (btnNovo) btnNovo.style.display = 'none';
        if (thAcoes) thAcoes.style.display = 'none';
        document.getElementById('agendarPanel').style.display = 'none';
      }

      if (window.loadVacationsGlobal) {
        window.loadVacationsGlobal();
      }
    });
  </script>
</body>

</html>
