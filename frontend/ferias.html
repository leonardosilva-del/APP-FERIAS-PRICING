<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de Férias</title>
    
    <!-- FAVICON LOCAL (PADRÃO DEFINITIVO) -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/favicon.png">

    <!-- html2pdf for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- SCRIPT DO MODO DARK GLOBAL (Impede a tela de piscar branco) -->
    <script>
        if (localStorage.getItem('tema-intranet') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
        function toggleDark() {
            document.documentElement.classList.toggle('dark-theme');
            const isDark = document.documentElement.classList.contains('dark-theme');
            localStorage.setItem('tema-intranet', isDark ? 'dark' : 'light');
            
            // Troca o ícone do botão
            const btnIcon = document.getElementById('icon-theme');
            if (btnIcon) {
                btnIcon.textContent = isDark ? '☀️' : '🌙';
            }
        }
    </script>

    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #e2e8f0;
            
            /* Status Férias Claras */
            --badge-agendado-bg: #fef3c7;
            --badge-agendado-color: #b45309;
            --badge-em-ferias-bg: #d1fae5;
            --badge-em-ferias-color: #047857;
            --badge-finalizada-bg: #e2e8f0;
            --badge-finalizada-color: #475569;
        }

        /* --- MODO DARK --- */
        html.dark-theme {
            --bg-color: #0f172a;        
            --card-bg: #1e293b;     
            --text-main: #f8fafc;       
            --text-muted: #94a3b8;       
            --border: #334155;   
            
            /* Status Férias Escuras */
            --badge-agendado-bg: #78350f;
            --badge-agendado-color: #fde68a;
            --badge-em-ferias-bg: #064e3b;
            --badge-em-ferias-color: #a7f3d0;
            --badge-finalizada-bg: #334155;
            --badge-finalizada-color: #cbd5e1;
        }

        html.dark-theme input {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        
        html.dark-theme table th { background-color: #0f172a; color: #cbd5e1; border-color: #334155; }
        html.dark-theme table td { border-color: #334155; }
        html.dark-theme table tr:hover td { background-color: #0f172a; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            position: relative;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            margin: 0;
            transition: background-color 0.3s ease;
        }

        /* --- WIDGET DE PERFIL --- */
        .user-profile-widget {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            padding: 6px 16px 6px 6px;
            border-radius: 50px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .user-profile-widget:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        .user-info-widget {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .user-name-widget {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.2;
        }

        .user-role-widget {
            font-size: 0.7rem;
            color: var(--text-muted);
            line-height: 1.2;
        }

        .btn-logout-widget {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px;
            margin-left: 4px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-logout-widget:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        /* Componentes Básicos */
        .glass-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Botões */
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        button:hover { background-color: var(--primary-hover); }

        .btn-export-pdf {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        .btn-export-pdf:hover {
            opacity: 1;
            color: var(--primary);
            background-color: rgba(37, 99, 235, 0.1);
            transform: translateY(-2px);
        }

        .btn-theme {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            font-size: 1.1rem;
            padding: 0.5rem 0.7rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-theme:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* Forms */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f8fafc;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background: var(--card-bg);
        }

        /* Tabela */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: var(--bg-color);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:hover td { background-color: var(--bg-color); }

        /* Badges de Status */
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-agendado { background: var(--badge-agendado-bg); color: var(--badge-agendado-color); }
        .status-em-ferias { background: var(--badge-em-ferias-bg); color: var(--badge-em-ferias-color); }
        .status-finalizada { background: var(--badge-finalizada-bg); color: var(--badge-finalizada-color); }

        .action-btn {
            background: transparent;
            color: var(--primary);
            font-size: 13px;
            padding: 6px 12px;
            border: 1px solid var(--primary);
            margin-right: 5px;
        }

        .action-btn:hover { background: rgba(37, 99, 235, 0.1); color: var(--primary-hover); }

        .action-btn.danger { color: var(--danger); border-color: var(--danger); }
        .action-btn.danger:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger-hover); }

        /* Toasts */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: var(--shadow-md);
            animation: slideIn 0.3s forwards;
            pointer-events: auto;
        }

        .toast.success { background-color: #10b981; }
        .toast.error { background-color: #ef4444; }
        .toast.info { background-color: #0ea5e9; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* IMPRESSÃO PDF */
        body.gerando-pdf .no-print { display: none !important; }
        body.gerando-pdf, body.gerando-pdf #root { background: #ffffff !important; color: #000000 !important; }
        body.gerando-pdf .glass-panel { background: #ffffff !important; box-shadow: none !important; border: 1px solid #e2e8f0 !important; }
        body.gerando-pdf h1, body.gerando-pdf h2, body.gerando-pdf th, body.gerando-pdf td { color: #1e293b !important; opacity: 1 !important; text-shadow: none !important; }
        body.gerando-pdf table th { font-weight: 700 !important; border-bottom: 2px solid #cbd5e1 !important; }
    </style>
</head>

<body>
    <div id="toast-container"></div>

    <div id="root" id="pdf-content">
        <div class="header-container glass-panel">
            <div class="logo">
                <img src="/logo.png" alt="DIA A DIA ;DD" style="height: 60px; object-fit: contain;"
                    onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
                <span style="display: none; color: var(--text-main); font-weight: bold; font-size: 1.5rem;">Intranet Pricing</span>
            </div>

            <div class="header-actions">
                <a href="/" class="no-print"
                    style="text-decoration: none; color: var(--text-muted); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: 8px; transition: all 0.2s; border: 1px solid transparent;"
                    title="Voltar ao Menu Principal">
                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                    Voltar
                </a>

                <!-- Botão discreto para gerar PDF -->
                <button onclick="exportarPDF()" class="btn-export-pdf no-print" title="Exportar Histórico para PDF">
                    <svg width="22" height="22" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                        </path>
                    </svg>
                </button>

                <!-- BOTÃO DE TEMA (DARK MODE) -->
                <button onclick="toggleDark()" class="btn-theme no-print" title="Alternar Tema Escuro/Claro">
                    <span id="icon-theme">🌙</span>
                </button>

                <!-- WIDGET DE PERFIL DO USUÁRIO -->
                <div class="user-profile-widget no-print">
                    <img id="user-photo" src="" class="user-avatar" alt="Foto">
                    <div class="user-info-widget">
                        <span id="user-name-widget" class="user-name-widget">Carregando...</span>
                        <span id="user-role-widget" class="user-role-widget">Colaborador</span>
                    </div>
                    <button id="btn-logout" class="btn-logout-widget" title="Sair da Intranet">
                        <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h1 style="margin: 0; color: var(--text-main); font-size: 1.8rem; font-weight: 700;">Controle de Férias</h1>
            <button id="toggleFormBtn" class="no-print" style="margin: 0; display: none;">+ Novo Agendamento</button>
        </div>

        <div class="glass-panel no-print" id="agendarPanel" style="display: none;">
            <h2 id="formTitle" style="margin-top:0;">Agendar Férias</h2>
            <form id="vacationForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nome do Colaborador</label>
                        <input type="text" id="nome" required placeholder="Ex: Thiago Nunes" />
                    </div>
                    <div class="form-group">
                        <label>Data de Início</label>
                        <input type="date" id="data_inicio" required />
                    </div>
                    <div class="form-group">
                        <label>Data de Fim</label>
                        <input type="date" id="data_fim" />
                    </div>
                    <div class="form-group">
                        <label>Dias de Férias</label>
                        <input type="number" id="dias_ferias" min="1" placeholder="Ex: 15" />
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; align-items: center;">
                    <button type="submit" id="submitBtn">Salvar Férias</button>
                    <button type="button" id="cancelBtn" class="action-btn"
                        style="display: none; border: none;">Cancelar</button>
                </div>
            </form>
        </div>

        <div class="glass-panel">
            <h2 style="margin-top:0;">Histórico da Equipe</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Colaborador</th>
                            <th>Início</th>
                            <th>Fim</th>
                            <th>Retorno</th>
                            <th>Dias</th>
                            <th>Status</th>
                            <th id="th-acoes" class="no-print" style="display: none;">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="7" style="text-align: center; color: var(--text-muted);">Carregando Férias...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Ajusta o ícone inicial com base no tema salvo
        document.addEventListener('DOMContentLoaded', () => {
            const isDark = localStorage.getItem('tema-intranet') === 'dark';
            const btnIcon = document.getElementById('icon-theme');
            if (btnIcon) btnIcon.textContent = isDark ? '☀️' : '🌙';
        });

        // --- FUNÇÃO EXPORTAR PDF ---
        window.exportarPDF = function () {
            document.body.classList.add('gerando-pdf');
            const element = document.getElementById('root');

            const opt = {
                margin: 10,
                filename: 'Controle_Ferias_Pricing.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, scrollX: 0, scrollY: 0, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            if (window.showToast) window.showToast("Preparando o seu PDF...", "info");

            html2pdf().set(opt).from(element).save().then(() => {
                document.body.classList.remove('gerando-pdf');
                if (window.showToast) window.showToast("PDF baixado com sucesso!", "success");
            }).catch(err => {
                document.body.classList.remove('gerando-pdf');
                if (window.showToast) window.showToast("Erro ao gerar PDF.", "error");
                console.error(err);
            });
        };

        document.addEventListener("DOMContentLoaded", () => {
            // --- App Logic ---
            const form = document.getElementById("vacationForm");
            const submitBtn = document.getElementById("submitBtn");
            const cancelBtn = document.getElementById("cancelBtn");
            const formTitle = document.getElementById("formTitle");
            const tableBody = document.getElementById("tableBody");
            const toggleFormBtn = document.getElementById("toggleFormBtn");
            const agendarPanel = document.getElementById("agendarPanel");

            const inputInicio = document.getElementById("data_inicio");
            const inputFim = document.getElementById("data_fim");
            const inputDias = document.getElementById("dias_ferias");
            const inputNome = document.getElementById("nome");

            let fetchTimeout;
            let editIndex = null;
            let currentVacations = [];

            const calculateDates = async () => {
                const inicio = inputInicio.value;
                const fim = inputFim.value;
                const dias = inputDias.value;

                if (inicio && (fim || dias)) {
                    try {
                        const res = await fetch("/api/calculate", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({
                                data_inicio: inicio,
                                data_fim: fim,
                                dias_ferias: dias ? parseInt(dias) : 0
                            })
                        });

                        if (res.ok) {
                            const data = await res.json();
                            if (data.data_fim !== fim) inputFim.value = data.data_fim;
                            if (data.dias_ferias.toString() !== dias) inputDias.value = data.dias_ferias;
                        }
                    } catch (err) {
                        console.error("Erro no cálculo", err);
                    }
                }
            };

            const handleInput = (e) => {
                if (e.target.id === "dias_ferias" && e.target.value) {
                    inputFim.value = "";
                } else if (e.target.id === "data_fim" && e.target.value) {
                    inputDias.value = "";
                }

                clearTimeout(fetchTimeout);
                fetchTimeout = setTimeout(calculateDates, 500);
            };

            inputInicio.addEventListener("input", handleInput);
            inputFim.addEventListener("input", handleInput);
            inputDias.addEventListener("input", handleInput);

            const formatDate = (dateStr) => {
                if (!dateStr) return "";
                const parts = dateStr.split("-");
                if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
                return dateStr;
            };

            toggleFormBtn.addEventListener("click", () => {
                if (agendarPanel.style.display === "none") {
                    agendarPanel.style.display = "block";
                    toggleFormBtn.innerText = "Fechar Formulário";
                } else {
                    agendarPanel.style.display = "none";
                    toggleFormBtn.innerText = "+ Novo Agendamento";
                    cancelEdit();
                }
            });

            const loadVacations = async () => {
                try {
                    const res = await fetch("/api/vacations");
                    const data = await res.json();
                    currentVacations = data.data || [];

                    if (currentVacations.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Nenhum registro encontrado.</td></tr>';
                        return;
                    }

                    currentVacations.sort((a, b) => {
                        if (!a["Data de Início"]) return 1;
                        if (!b["Data de Início"]) return -1;
                        const dataA = new Date(a["Data de Início"]);
                        const dataB = new Date(b["Data de Início"]);
                        return dataA - dataB;
                    });

                    tableBody.innerHTML = "";
                    currentVacations.forEach((v) => {
                        const tr = document.createElement("tr");

                        let badgeClass = 'status-agendado';
                        if (v.Status === 'Em Férias') badgeClass = 'status-em-ferias';
                        if (v.Status === 'Finalizada') badgeClass = 'status-finalizada';

                        tr.innerHTML = `
              <td><strong>${v.Nome}</strong></td>
              <td>${formatDate(v["Data de Início"])}</td>
              <td>${formatDate(v["Data de Fim"])}</td>
              <td>${formatDate(v["Dia de Retorno"])}</td>
              <td>${v["Dias de Férias"]}</td>
              <td><span class="status-badge ${badgeClass}">${v.Status}</span></td>
              ${window.perfilUsuario === 'Gestor' ? `
              <td class="no-print">
                <button type="button" class="action-btn" onclick="window.editVacation(${v.id})">Editar</button>
                <button type="button" class="action-btn danger" onclick="window.deleteVacation(${v.id})">Excluir</button>
              </td>` : ''}
            `;
                        tableBody.appendChild(tr);
                    });
                } catch (err) {
                    console.error(err);
                    tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--danger);">Erro ao carregar dados do servidor.</td></tr>';
                }
            };
            window.loadVacationsGlobal = loadVacations;

            window.editVacation = (id) => {
                if (window.perfilUsuario !== 'Gestor') return;
                const v = currentVacations.find(item => item.id === id);
                if (!v) return;
                inputNome.value = v.Nome;
                inputInicio.value = v["Data de Início"];
                inputFim.value = v["Data de Fim"];
                inputDias.value = v["Dias de Férias"];

                editIndex = id;
                formTitle.innerText = "Editar Férias";
                submitBtn.innerText = "Atualizar Férias";
                cancelBtn.style.display = "block";
                agendarPanel.style.display = "block";
                toggleFormBtn.innerText = "Fechar Formulário";
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            window.deleteVacation = async (id) => {
                if (window.perfilUsuario !== 'Gestor') return;
                if (!confirm("Tem certeza que deseja excluir esse registro?")) return;

                try {
                    const res = await fetch(`/api/vacations/${id}`, { method: "DELETE" });
                    if (res.ok) {
                        if (window.showToast) window.showToast("Excluído com sucesso!", "success");
                        loadVacations();
                        if (editIndex === id) cancelEdit();
                    } else {
                        const err = await res.json();
                        let msg = err.detail;
                        if (Array.isArray(msg)) msg = msg.map(e => "Preencha todos os campos corretamente.").join(", ");
                        if (window.showToast) window.showToast("Erro: " + msg, "error");
                    }
                } catch (err) {
                    if (window.showToast) window.showToast("Erro ao excluir.", "error");
                }
            };

            const cancelEdit = () => {
                editIndex = null;
                form.reset();
                formTitle.innerText = "Agendar Férias";
                submitBtn.innerText = "Salvar Férias";
                cancelBtn.style.display = "none";
                agendarPanel.style.display = "none";
                toggleFormBtn.innerText = "+ Novo Agendamento";
            };

            cancelBtn.addEventListener("click", cancelEdit);

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                if (window.perfilUsuario !== 'Gestor') return;

                submitBtn.disabled = true;
                const originalText = submitBtn.innerText;
                submitBtn.innerText = "Salvando...";

                try {
                    const payload = {
                        nome: inputNome.value,
                        data_inicio: inputInicio.value,
                        data_fim: inputFim.value,
                        dias_ferias: parseInt(inputDias.value || 0)
                    };

                    const url = editIndex !== null ? `/api/vacations/${editIndex}` : "/api/vacations";
                    const method = editIndex !== null ? "PUT" : "POST";

                    const res = await fetch(url, {
                        method: method,
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    if (res.ok) {
                        if (window.showToast) window.showToast(editIndex !== null ? "Férias atualizadas!" : "Férias cadastradas com sucesso!", "success");
                        cancelEdit();
                        loadVacations();
                    } else {
                        const err = await res.json();
                        let msg = err.detail;
                        if (Array.isArray(msg)) msg = msg.map(e => "Preencha todos os campos corretamente.").join(", ");
                        if (window.showToast) window.showToast("Erro: " + msg, "error");
                    }
                } catch (err) {
                    if (window.showToast) window.showToast("Erro ao conectar com o servidor.", "error");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.innerText = originalText;
                }
            });
        });
    </script>

    <!-- FIREBASE AUTHENTICATION SCRIPT -->
    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { ref, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        window.perfilUsuario = "Colaborador";

        window.showToast = function (message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "/";
                return;
            }

            document.getElementById('user-photo').src = user.photoURL || 'https://via.placeholder.com/40';
            document.getElementById('user-name-widget').textContent = user.displayName ? user.displayName.split(' ')[0] : 'Usuário';

            const userRef = ref(db, 'usuarios/' + user.uid);
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    window.perfilUsuario = snapshot.val().perfil || "Colaborador";
                }

                document.getElementById('user-role-widget').textContent = window.perfilUsuario;

                const btnNovo = document.getElementById('toggleFormBtn');
                const thAcoes = document.getElementById('th-acoes');

                if (window.perfilUsuario === "Gestor") {
                    if (btnNovo) btnNovo.style.display = 'block';
                    if (thAcoes) thAcoes.style.display = 'table-cell';
                } else {
                    if (btnNovo) btnNovo.style.display = 'none';
                    if (thAcoes) thAcoes.style.display = 'none';
                    document.getElementById('agendarPanel').style.display = 'none';
                }

                if (window.loadVacationsGlobal) {
                    window.loadVacationsGlobal();
                }
            });
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            signOut(auth).then(() => {
                window.location.href = "/";
            });
        });
    </script>
</body>
