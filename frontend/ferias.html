<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Controle de Férias</title>
    
    <!-- FAVICON LOCAL (PADRÃO DEFINITIVO) -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" type="image/png" href="/favicon.png">

    <!-- html2pdf for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- SCRIPT DO MODO DARK GLOBAL (Impede a tela de piscar branco) -->
    <script>
        if (localStorage.getItem('tema-intranet') === 'dark') {
            document.documentElement.classList.add('dark-theme');
        }
        function toggleDark() {
            document.documentElement.classList.toggle('dark-theme');
            const isDark = document.documentElement.classList.contains('dark-theme');
            localStorage.setItem('tema-intranet', isDark ? 'dark' : 'light');
            
            // Troca o ícone do botão
            const btnIcon = document.getElementById('icon-theme');
            if (btnIcon) {
                btnIcon.textContent = isDark ? '☀️' : '🌙';
            }
        }
    </script>

    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #e2e8f0;
            
            /* Status Férias Claras */
            --badge-agendado-bg: #fef3c7;
            --badge-agendado-color: #b45309;
            --badge-em-ferias-bg: #d1fae5;
            --badge-em-ferias-color: #047857;
            --badge-finalizada-bg: #e2e8f0;
            --badge-finalizada-color: #475569;
        }

        /* --- MODO DARK --- */
        html.dark-theme {
            --bg-color: #0f172a;        
            --card-bg: #1e293b;     
            --text-main: #f8fafc;       
            --text-muted: #94a3b8;       
            --border: #334155;   
            
            /* Status Férias Escuras */
            --badge-agendado-bg: #78350f;
            --badge-agendado-color: #fde68a;
            --badge-em-ferias-bg: #064e3b;
            --badge-em-ferias-color: #a7f3d0;
            --badge-finalizada-bg: #334155;
            --badge-finalizada-color: #cbd5e1;
        }

        html.dark-theme input {
            background-color: #0f172a !important;
            color: #f8fafc !important;
            border-color: #334155 !important;
        }
        
        html.dark-theme table th { background-color: #0f172a; color: #cbd5e1; border-color: #334155; }
        html.dark-theme table td { border-color: #334155; }
        html.dark-theme table tr:hover td { background-color: #0f172a; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            position: relative;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding: 2rem;
            margin: 0;
            transition: background-color 0.3s ease;
        }

        /* --- WIDGET DE PERFIL --- */
        .user-profile-widget {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            padding: 6px 16px 6px 6px;
            border-radius: 50px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            transition: all 0.2s ease;
        }

        .user-profile-widget:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            transform: translateY(-1px);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        .user-info-widget {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .user-name-widget {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            line-height: 1.2;
        }

        .user-role-widget {
            font-size: 0.7rem;
            color: var(--text-muted);
            line-height: 1.2;
        }

        .btn-logout-widget {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px;
            margin-left: 4px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .btn-logout-widget:hover {
            background: #fee2e2;
            color: #ef4444;
        }

        /* Componentes Básicos */
        .glass-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Botões */
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        button:hover { background-color: var(--primary-hover); }

        .btn-export-pdf {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        .btn-export-pdf:hover {
            opacity: 1;
            color: var(--primary);
            background-color: rgba(37, 99, 235, 0.1);
            transform: translateY(-2px);
        }

        .btn-theme {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            font-size: 1.1rem;
            padding: 0.5rem 0.7rem;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-theme:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        /* Forms */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #f8fafc;
            color: var(--text-main);
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            background: var(--card-bg);
        }

        /* Tabela */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background: var(--bg-color);
            color: var(--text-muted);
            font-weight: 600;
            font-size: 13px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
            color: var(--text-main);
            vertical-align: middle;
        }

        tr:hover td { background-color: var(--bg-color); }

        /* Badges de Status */
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-agendado { background: var(--badge-agendado-bg); color: var(--badge-agendado-color); }
        .status-em-ferias { background: var(--badge-em-ferias-bg); color: var(--badge-em-ferias-color); }
        .status-finalizada { background: var(--badge-finalizada-bg); color: var(--badge-finalizada-color); }

        .action-btn {
            background: transparent;
            color: var(--primary);
            font-size: 13px;
            padding: 6px 12px;
            border: 1px solid var(--primary);
            margin-right: 5px;
        }

        .action-btn:hover { background: rgba(37, 99, 235, 0.1); color: var(--primary-hover); }

        .action-btn.danger { color: var(--danger); border-color: var(--danger); }
        .action-btn.danger:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger-hover); }

        /* Toasts */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
        }

        .toast {
            padding: 15px 20px;
            border-radius: 8px;
            color: white;
            font-weight: 500;
            font-size: 14px;
            box-shadow: var(--shadow-md);
            animation: slideIn 0.3s forwards;
            pointer-events: auto;
        }

        .toast.success { background-color: #10b981; }
        .toast.error { background-color: #ef4444; }
        .toast.info { background-color: #0ea5e9; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* IMPRESSÃO PDF */
        body.gerando-pdf .no-print { display: none !important; }
        body.gerando-pdf, body.gerando-pdf #root { background: #ffffff !important; color: #000000 !important; }
        body.gerando-pdf .glass-panel { background: #ffffff !important; box-shadow: none !important; border: 1px solid #e2e8f0 !important; }
        body.gerando-pdf h1, body.gerando-pdf h2, body.gerando-pdf th, body.gerando-pdf td { color: #1e293b !important; opacity: 1 !important; text-shadow: none !important; }
        body.gerando-pdf table th { font-weight: 700 !important; border-bottom: 2px solid #cbd5e1 !important; }
    </style>
</head>

<body>
    <div id="toast-container"></div>

    <div id="root" id="pdf-content">
        <div class="header-container glass-panel">

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">

    <script>
        // Ajusta o ícone inicial com base no tema salvo
        document.addEventListener('DOMContentLoaded', () => {
            const isDark = localStorage.getItem('tema-intranet') === 'dark';
            const btnIcon = document.getElementById('icon-theme');
            if (btnIcon) btnIcon.textContent = isDark ? '☀️' : '🌙';
        });

        // --- FUNÇÃO EXPORTAR PDF ---
        window.exportarPDF = function () {
            document.body.classList.add('gerando-pdf');
            const element = document.getElementById('root');

            const opt = {
                margin: 10,
                filename: 'Controle_Ferias_Pricing.pdf',
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, scrollX: 0, scrollY: 0, useCORS: true, backgroundColor: '#ffffff' },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            if (window.showToast) window.showToast("Preparando o seu PDF...", "info");

            html2pdf().set(opt).from(element).save().then(() => {
                document.body.classList.remove('gerando-pdf');
                if (window.showToast) window.showToast("PDF baixado com sucesso!", "success");
            }).catch(err => {
                document.body.classList.remove('gerando-pdf');
                if (window.showToast) window.showToast("Erro ao gerar PDF.", "error");
                console.error(err);
            });
        };
    </script>

    <!-- SCRIPT PRINCIPAL INTEGRADO AO FIREBASE -->
    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";
        import { ref, onValue, push, remove, update, get } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        const feriasRef = ref(db, 'ferias');
        window.perfilUsuario = "Colaborador";

        let editId = null;
        let currentVacations = [];

        // TOAST NOTIFICATIONS
        window.showToast = function (message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = message;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // CÁLCULOS DE DATA E DIAS
        function calcularDataFim(inicioStr, dias) {
            if (!inicioStr || !dias) return "";
            const [y, m, d] = inicioStr.split("-").map(Number);
            const dt = new Date(y, m - 1, d);
            dt.setDate(dt.getDate() + (parseInt(dias) - 1));
            const ano = dt.getFullYear();
            const mes = String(dt.getMonth() + 1).padStart(2, '0');
            const dia = String(dt.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        function calcularDias(inicioStr, fimStr) {
            if (!inicioStr || !fimStr) return 0;
            const [y1, m1, d1] = inicioStr.split("-").map(Number);
            const [y2, m2, d2] = fimStr.split("-").map(Number);
            const dt1 = new Date(y1, m1 - 1, d1);
            const dt2 = new Date(y2, m2 - 1, d2);
            const diffTime = dt2 - dt1;
            const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24)) + 1;
            return diffDays > 0 ? diffDays : 0;
        }

        function calcularDiaRetorno(fimStr) {
            if (!fimStr) return "";
            const [y, m, d] = fimStr.split("-").map(Number);
            const dt = new Date(y, m - 1, d);
            dt.setDate(dt.getDate() + 1);
            // Pula Sábado (6) e Domingo (0)
            while (dt.getDay() === 0 || dt.getDay() === 6) {
                dt.setDate(dt.getDate() + 1);
            }
            const ano = dt.getFullYear();
            const mes = String(dt.getMonth() + 1).padStart(2, '0');
            const dia = String(dt.getDate()).padStart(2, '0');
            return `${ano}-${mes}-${dia}`;
        }

        function calcularStatus(inicioStr, fimStr) {
            if (!inicioStr || !fimStr) return "Agendado";
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);

            const [y1, m1, d1] = inicioStr.split("-").map(Number);
            const inicio = new Date(y1, m1 - 1, d1);

            const [y2, m2, d2] = fimStr.split("-").map(Number);
            const fim = new Date(y2, m2 - 1, d2);

            if (hoje < inicio) return "Agendado";
            if (hoje > fim) return "Finalizada";
            return "Em Férias";
        }

        const formatDate = (dateStr) => {
            if (!dateStr) return "";
            const parts = dateStr.split("-");
            if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
            return dateStr;
        };

        // BASE INICIAL DE FÉRIAS (Incluindo Edimilton Gualberto)
        const FERIAS_INICIAIS = [
            { nome: "Thiago Nunes", data_inicio: "2026-07-01", data_fim: "2026-07-15", dia_retorno: "2026-07-16", dias_ferias: 15 },
            { nome: "Rodrigo", data_inicio: "2026-08-01", data_fim: "2026-08-15", dia_retorno: "2026-08-17", dias_ferias: 15 },
            { nome: "Gian", data_inicio: "2026-08-03", data_fim: "2026-09-01", dia_retorno: "2026-09-02", dias_ferias: 30 },
            { nome: "Carolina Lima", data_inicio: "2026-12-04", data_fim: "2027-01-02", dia_retorno: "2027-01-04", dias_ferias: 30 },
            { nome: "Leonardo", data_inicio: "2026-08-17", data_fim: "2026-08-31", dia_retorno: "2026-09-01", dias_ferias: 15 },
            { nome: "João", data_inicio: "2026-11-02", data_fim: "2026-12-01", dia_retorno: "2026-12-02", dias_ferias: 30 },
            { nome: "Jorge", data_inicio: "2027-01-14", data_fim: "2027-02-12", dia_retorno: "2027-02-15", dias_ferias: 30 },
            { nome: "Rodrigo", data_inicio: "2026-12-21", data_fim: "2027-01-04", dia_retorno: "2027-01-05", dias_ferias: 15 },
            { nome: "Pedro Henrique", data_inicio: "2026-10-01", data_fim: "2026-10-30", dia_retorno: "2026-11-02", dias_ferias: 30 },
            { nome: "Edimilton Gualberto", data_inicio: "2027-01-18", data_fim: "2027-02-16", dia_retorno: "2027-02-17", dias_ferias: 30 }
        ];

        // ELEMENTOS DO FORMULÁRIO E TABELA
        const form = document.getElementById("vacationForm");
        const submitBtn = document.getElementById("submitBtn");
        const cancelBtn = document.getElementById("cancelBtn");
        const formTitle = document.getElementById("formTitle");
        const tableBody = document.getElementById("tableBody");
        const toggleFormBtn = document.getElementById("toggleFormBtn");
        const agendarPanel = document.getElementById("agendarPanel");

        const inputInicio = document.getElementById("data_inicio");
        const inputFim = document.getElementById("data_fim");
        const inputDias = document.getElementById("dias_ferias");
        const inputNome = document.getElementById("nome");

        // RENDERIZAR TABELA
        function renderTable() {
            if (!tableBody) return;

            if (currentVacations.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">Nenhum registro encontrado.</td></tr>';
                return;
            }

            currentVacations.sort((a, b) => {
                if (!a.data_inicio) return 1;
                if (!b.data_inicio) return -1;
                return new Date(a.data_inicio) - new Date(b.data_inicio);
            });

            tableBody.innerHTML = "";
            currentVacations.forEach((v) => {
                const tr = document.createElement("tr");
                const status = calcularStatus(v.data_inicio, v.data_fim);

                let badgeClass = 'status-agendado';
                if (status === 'Em Férias') badgeClass = 'status-em-ferias';
                if (status === 'Finalizada') badgeClass = 'status-finalizada';

                tr.innerHTML = `
                    <td><strong>${v.nome || ''}</strong></td>
                    <td>${formatDate(v.data_inicio)}</td>
                    <td>${formatDate(v.data_fim)}</td>
                    <td>${formatDate(v.dia_retorno)}</td>
                    <td>${v.dias_ferias || ''}</td>
                    <td><span class="status-badge ${badgeClass}">${status}</span></td>
                    ${window.perfilUsuario === 'Gestor' ? `
                    <td class="no-print">
                        <button type="button" class="action-btn" onclick="window.editVacation('${v.id}')">Editar</button>
                        <button type="button" class="action-btn danger" onclick="window.deleteVacation('${v.id}')">Excluir</button>
                    </td>` : ''}
                `;
                tableBody.appendChild(tr);
            });
        }

        // SINCRONIZAÇÃO EM TEMPO REAL COM FIREBASE
        onValue(feriasRef, (snapshot) => {
            if (!snapshot.exists()) {
                // Primeira inicialização do nó 'ferias' no Firebase
                FERIAS_INICIAIS.forEach(item => {
                    const status = calcularStatus(item.data_inicio, item.data_fim);
                    push(feriasRef, { ...item, status });
                });
                return;
            }

            currentVacations = [];
            snapshot.forEach((child) => {
                const val = child.val();
                currentVacations.push({
                    id: child.key,
                    nome: val.nome || val.Nome || "",
                    data_inicio: val.data_inicio || val["Data de Início"] || "",
                    data_fim: val.data_fim || val["Data de Fim"] || "",
                    dia_retorno: val.dia_retorno || val["Dia de Retorno"] || "",
                    dias_ferias: val.dias_ferias !== undefined ? val.dias_ferias : (val["Dias de Férias"] || 0),
                    status: val.status || val.Status || ""
                });
            });

            // Garante que o Edimilton Gualberto estará salvo no Firebase caso o banco já existisse sem ele
            const temEdimilton = currentVacations.some(v => (v.nome || '').toLowerCase().includes("edimilton"));
            if (!temEdimilton) {
                const edimiltonData = FERIAS_INICIAIS.find(f => f.nome.includes("Edimilton"));
                if (edimiltonData) {
                    const status = calcularStatus(edimiltonData.data_inicio, edimiltonData.data_fim);
                    push(feriasRef, { ...edimiltonData, status });
                }
            }

            renderTable();
        });

        // CÁLCULOS DINÂMICOS AO DIGITAR
        inputInicio.addEventListener("input", () => {
            if (inputDias.value) {
                inputFim.value = calcularDataFim(inputInicio.value, inputDias.value);
            } else if (inputFim.value) {
                inputDias.value = calcularDias(inputInicio.value, inputFim.value);
            }
        });

        inputDias.addEventListener("input", (e) => {
            if (e.target.value) {
                inputFim.value = "";
                if (inputInicio.value) {
                    inputFim.value = calcularDataFim(inputInicio.value, e.target.value);
                }
            }
        });

        inputFim.addEventListener("input", (e) => {
            if (e.target.value) {
                inputDias.value = "";
                if (inputInicio.value) {
                    inputDias.value = calcularDias(inputInicio.value, e.target.value);
                }
            }
        });

        // CONTROLE DO PAINEL DE AGENDAMENTO
        toggleFormBtn.addEventListener("click", () => {
            if (agendarPanel.style.display === "none") {
                agendarPanel.style.display = "block";
                toggleFormBtn.innerText = "Fechar Formulário";
            } else {
                cancelEdit();
            }
        });

        const cancelEdit = () => {
            editId = null;
            form.reset();
            formTitle.innerText = "Agendar Férias";
            submitBtn.innerText = "Salvar Férias";
            cancelBtn.style.display = "none";
            agendarPanel.style.display = "none";
            toggleFormBtn.innerText = "+ Novo Agendamento";
        };

        cancelBtn.addEventListener("click", cancelEdit);

        // FUNÇÃO EDITAR
        window.editVacation = (id) => {
            if (window.perfilUsuario !== 'Gestor') return;
            const v = currentVacations.find(item => item.id == id);
            if (!v) return;

            inputNome.value = v.nome;
            inputInicio.value = v.data_inicio;
            inputFim.value = v.data_fim;
            inputDias.value = v.dias_ferias;

            editId = id;
            formTitle.innerText = "Editar Férias";
            submitBtn.innerText = "Atualizar Férias";
            cancelBtn.style.display = "block";
            agendarPanel.style.display = "block";
            toggleFormBtn.innerText = "Fechar Formulário";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        // FUNÇÃO EXCLUIR
        window.deleteVacation = async (id) => {
            if (window.perfilUsuario !== 'Gestor') return;
            if (!confirm("Tem certeza que deseja excluir esse registro?")) return;

            try {
                await remove(ref(db, `ferias/${id}`));
                window.showToast("Férias excluídas com sucesso!", "success");
                if (editId === id) cancelEdit();
            } catch (err) {
                console.error(err);
                window.showToast("Erro ao excluir.", "error");
            }
        };

        // SUBMIT DO FORMULÁRIO (SALVAR / ATUALIZAR)
        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (window.perfilUsuario !== 'Gestor') return;

            submitBtn.disabled = true;
            const originalText = submitBtn.innerText;
            submitBtn.innerText = "Salvando...";

            try {
                const inicio = inputInicio.value;
                let fim = inputFim.value;
                let dias = parseInt(inputDias.value || 0);

                if (inicio && dias && !fim) {
                    fim = calcularDataFim(inicio, dias);
                    inputFim.value = fim;
                } else if (inicio && fim && !dias) {
                    dias = calcularDias(inicio, fim);
                    inputDias.value = dias;
                }

                const retorno = calcularDiaRetorno(fim);
                const status = calcularStatus(inicio, fim);

                const payload = {
                    nome: inputNome.value.trim(),
                    data_inicio: inicio,
                    data_fim: fim,
                    dia_retorno: retorno,
                    dias_ferias: dias,
                    status: status
                };

                if (editId !== null) {
                    await update(ref(db, `ferias/${editId}`), payload);
                    window.showToast("Férias atualizadas com sucesso!", "success");
                } else {
                    await push(feriasRef, payload);
                    window.showToast("Férias cadastradas com sucesso!", "success");
                }
                cancelEdit();
            } catch (err) {
                console.error(err);
                window.showToast("Erro ao salvar no Firebase.", "error");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = originalText;
            }
        });

        // AUTENTICAÇÃO E PERFIL DO USUÁRIO
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "/";
                return;
            }

            const photoEl = document.getElementById('user-photo');
            if (photoEl) photoEl.src = user.photoURL || 'https://via.placeholder.com/40';

            const nameEl = document.getElementById('user-name-widget');
            if (nameEl) nameEl.textContent = user.displayName ? user.displayName.split(' ')[0] : 'Usuário';

            const userRef = ref(db, 'usuarios/' + user.uid);
            get(userRef).then((snapshot) => {
                if (snapshot.exists()) {
                    window.perfilUsuario = snapshot.val().perfil || "Colaborador";
                    if (snapshot.val().nome && nameEl) {
                        nameEl.textContent = snapshot.val().nome.split(' ')[0];
                    }
                }

                const roleEl = document.getElementById('user-role-widget');
                if (roleEl) roleEl.textContent = window.perfilUsuario;

                const btnNovo = document.getElementById('toggleFormBtn');
                const thAcoes = document.getElementById('th-acoes');

                if (window.perfilUsuario === "Gestor") {
                    if (btnNovo) btnNovo.style.display = 'block';
                    if (thAcoes) thAcoes.style.display = 'table-cell';
                } else {
                    if (btnNovo) btnNovo.style.display = 'none';
                    if (thAcoes) thAcoes.style.display = 'none';
                    if (agendarPanel) agendarPanel.style.display = 'none';
                }

                renderTable();
            });
        });

        // LOGOUT
        const btnLogout = document.getElementById('btn-logout');
        if (btnLogout) {
            btnLogout.addEventListener('click', () => {
                signOut(auth).then(() => {
                    window.location.href = "/";
                });
            });
        }
    </script>
</body>

</html>
